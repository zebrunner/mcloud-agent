---
# A failed pull is reported but does not stop the deploy: the image may exist locally only.
# The images are pulled for the platform of the host (arm64 on Apple Silicon), appium is linux/amd64 only.
# A connector is pulled for the platforms (os) of the registered devices only; without a list of devices, for both.
- name: Platforms of the devices
  ansible.builtin.set_fact:
    download_platforms: "{{ ['android', 'ios'] if devices | default(none) is none else devices | map(attribute='os') | unique | list }}"
  tags: [pull, download]

- name: Pull Zebrunner images
  ansible.builtin.command: docker pull {{ '--platform linux/amd64 ' if item.amd64 else '' }}"{{ item.image }}"
  loop:
    - {image: "{{ DEVICE_IMAGE }}:{{ DEVICE_VERSION }}", amd64: false}
    - {image: "{{ APPIUM_IMAGE }}:{{ APPIUM_VERSION }}", amd64: true}
    - {image: "{{ UPLOADER_IMAGE }}:{{ UPLOADER_VERSION }}", amd64: false}
    - {image: "{{ IOS_CONNECTOR_IMAGE }}:{{ IOS_CONNECTOR_VERSION }}", amd64: false, os: ios}
    - {image: "{{ ANDROID_CONNECTOR_IMAGE }}:{{ ANDROID_CONNECTOR_VERSION }}", amd64: false, os: android}
  loop_control:
    label: "{{ item.image }}"
  when: item.os is not defined or item.os in download_platforms
  register: download_images_pull
  ignore_errors: true
  changed_when: false
  tags: [pull, download]

- name: Check that images failed to pull exist locally
  ansible.builtin.command: docker image inspect "{{ item.item.image }}"
  loop: "{{ download_images_pull.results | select('failed') | list }}"
  loop_control:
    label: "{{ item.item.image }}"
  changed_when: false
  tags: [pull, download]

- name: Create infra network if absent
  ansible.builtin.shell: docker network inspect "{{ STF_DOCKER_NETWORK }}" >/dev/null 2>&1 || docker network create "{{ STF_DOCKER_NETWORK }}"
  changed_when: false
  tags: [pull, download]

# The Developer Disk Images of the iOS devices (README.md#developer-disk-images): a shallow clone, updated by every deploy,
# as the user of the deploy, the owner of the agent folder. force: the commit fetched into a shallow clone is not a
# descendant of the earlier one, and a local change is dropped. A failed clone or update does not stop the deploy: the
# connector mounts the earlier checkout or downloads the images itself.
- name: Clone the Developer Disk Images of the iOS devices
  ansible.builtin.git:
    repo: "{{ DDI_REPO }}"
    dest: "{{ DDI_DIR | default('', true) or agent_dir ~ '/DeveloperDiskImages' }}"
    version: "{{ DDI_VERSION }}"
    depth: 1
    force: true
  become: false
  when: DDI_ENABLED | bool and 'ios' in download_platforms
  register: download_ddi
  ignore_errors: true
  tags: [pull, download]

- name: Report the Developer Disk Images not updated
  ansible.builtin.debug:
    msg: "The Developer Disk Images of {{ DDI_REPO }} ({{ DDI_VERSION }}) are not updated: the connectors mount the earlier clone or download the images"
  when: download_ddi is failed
  tags: [pull, download]
