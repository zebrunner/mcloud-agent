---

- name: Check OS compatibility
  assert:
    that:
      - ansible_facts['system'] == "Linux"
    fail_msg: "OS version is not compatible! This playbook supports Linux only."
    success_msg: "OS is compatible: {{ ansible_facts['system'] }}"
  tags: [devices, precheck]

- name: Check setup completion
  assert:
    that:
      - lookup('file', 'roles/devices/vars/main.yml', errors='ignore') is not none
    fail_msg: "You have to set up services in advance using: ./zebrunner.sh setup!"
    success_msg: "Setup is ready: 'roles/devices/vars/main.yml' exists."
  tags: [devices, precheck]

- name: Check 'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable
  assert:
    that:
      - lookup('env','ZEBRUNNER_MCLOUD_AGENT_DIR') is not none
    fail_msg: "You have to set up 'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable in advance!"
    success_msg: "'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable is defined."
  tags: [devices, precheck]

- name: Collect all device IDs and names
  set_fact:
    all_ids: "{{ devices | map(attribute='id') | list }}"
    all_names: "{{ devices | map(attribute='name') | list }}"
  tags: [devices, precheck, dedup]

- name: Find duplicate device IDs
  set_fact:
    dup_ids: "{{ dup_ids + [item] }}"
  loop: "{{ all_ids | unique }}"
  when: all_ids | select('equalto', item) | list | length > 1

- name: Find duplicate device names
  set_fact:
    dup_ids: "{{ id_counts | dict2items | selectattr('value', '>', 1) | map(attribute='key') | list }}"
  tags: [devices, precheck, dedup]

- name: Determine duplicate names
  set_fact:
    dup_names: "{{ name_counts | dict2items | selectattr('value', '>', 1) | map(attribute='key') | list }}"
  tags: [devices, precheck, dedup]

- name: Check for duplicate device IDs or names
  assert:
    that:
      - dup_ids | length == 0
      - dup_names | length == 0
    fail_msg: "Duplicate devices found! Duplicate IDs: {{ dup_ids }} Duplicate Names: {{ dup_names }}"
    success_msg: "All device IDs and names are unique."
  tags: [devices, precheck, dedup]

- name: Copy 'zebrunner-farm' script file
  template:
    src: zebrunner-farm
    dest: /usr/local/bin/zebrunner-farm
    mode: '0755'
    owner: root
    group: root
  tags: [devices, files]

- name: Copy rules file
  template:
    src: 90_mcloud.rules
    dest: /etc/udev/rules.d/90_mcloud.rules
    mode: '0644'
    owner: root
    group: root
  tags: [devices, udev, files]

- name: Copy devices details file
  template:
    src: mcloud-devices.txt
    dest: /usr/local/bin/mcloud-devices.txt
    mode: '0644'
    owner: root
    group: root
  tags: [devices, files]

- name: Reload udev rules
  command: udevadm control --reload
  register: udev_reload
  failed_when: udev_reload.rc != 0
  changed_when: false
  tags: [devices, udev]

- name: Usbmuxd mask and stop
  systemd:
    name: usbmuxd
    masked: yes
    state: stopped
  become: true
  ignore_errors: yes
  tags: [devices, usbmuxd]

- name: ADB handling
  block:
    - name: ADB existence check
      command: which adb
      register: adb_exists
      failed_when: false
      changed_when: false

    - name: ADB kill server
      command: adb kill-server
      register: adb_kill
      failed_when: adb_exists.rc == 0 and adb_kill.rc != 0
      changed_when: false
      when: adb_exists.rc == 0
      become: true
      ignore_errors: yes

    - name: ADB stop status
      assert:
        that:
          - adb_exists.rc != 0 or adb_kill.rc == 0
        success_msg: |
          {% if adb_exists.rc != 0 %}
          ADB is not installed.
          {% else %}
          ADB stopped successfully.
          {% endif %}
        fail_msg: "Failed to stop ADB server!"
      ignore_errors: yes
  tags: [devices, adb]
