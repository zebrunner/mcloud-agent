---
- name: Check OS compatibility
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == "Linux"
    fail_msg: "OS version is not compatible! This playbook supports Linux only."
    success_msg: "OS is compatible: {{ ansible_facts['system'] }}"
  tags: [devices, precheck]

- name: Check the settings and the devices
  ansible.builtin.import_role:
    name: common
    tasks_from: checks
  vars:
    common_os_role: devices
    common_os: linux

# the settings have the secrets of the host: root (udev) and the group of the user only
- name: Deploy 'zebrunner-farm'
  ansible.builtin.import_role:
    name: common
    tasks_from: farm
  vars:
    common_farm_os: linux
    common_farm_owner: root
    common_farm_group: "{{ lookup('pipe', 'id -g') }}"
    common_farm_env_mode: "0640"

# the tunnel to MCloud of WG_ENABLED (README.md#wireguard-tunnel): wg-quick@mcloud-node, removed without it
- name: Deploy the WireGuard tunnel to MCloud
  ansible.builtin.import_role:
    name: common
    tasks_from: wireguard
  vars:
    common_wg_os: linux

# the group of the device nodes of the USB devices of the rules (USB_DEVICE_GROUP), plugdev of Debian and Ubuntu
- name: Check the group of the USB devices
  ansible.builtin.assert:
    that: USB_DEVICE_GROUP | string is regex('^[a-z_][a-z0-9_-]{0,31}$')
    fail_msg: "USB_DEVICE_GROUP must be the name of a group (lower case letters, digits, '_' and '-')"
    quiet: true
  tags: [devices, precheck, validate, udev]

- name: Create the group of the USB devices
  ansible.builtin.group:
    name: "{{ USB_DEVICE_GROUP }}"
    system: true
    state: present
  tags: [devices, udev, files]

- name: Copy rules file
  ansible.builtin.template:
    src: 90_mcloud.rules
    dest: /etc/udev/rules.d/90_mcloud.rules
    mode: "0644"
    owner: root
    group: root
  tags: [devices, udev, files]

# udev queues the jobs of these units for a connected or disconnected device (90_mcloud.rules)
- name: Copy the units of the devices
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  loop:
    - mcloud-device-restart@.service
    - mcloud-device-down@.service
  tags: [devices, udev, files]

# The wireless watchdog (README.md#wireless-watchdog): udev starts no wireless device, a timer starts the containers of
# the wireless devices that stopped by themselves; removed from a host without wireless devices or with
# WIRELESS_WATCHDOG_INTERVAL 0 (the next task makes systemd forget the removed units)
- name: Wireless watchdog
  vars:
    devices_watchdog: >-
      {{ (WIRELESS_WATCHDOG_INTERVAL | int) > 0 and (devices | map(attribute='connection', default='usb') | map('string')
         | map('lower') | select('equalto', 'wireless') | list | length > 0) }}
  tags: [devices, watchdog]
  block:
    - name: Copy the units of the wireless watchdog
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - mcloud-wireless-watchdog.service
        - mcloud-wireless-watchdog.timer
      register: devices_watchdog_units
      when: devices_watchdog | bool
      tags: [files]

    # a changed interval applies at once
    - name: Start the timer of the wireless watchdog (mcloud-wireless-watchdog.timer)
      ansible.builtin.systemd:
        name: mcloud-wireless-watchdog.timer
        daemon_reload: true
        enabled: true
        state: "{{ 'restarted' if devices_watchdog_units is changed else 'started' }}"
      when: devices_watchdog | bool and not ansible_check_mode

    - name: Find the timer of the wireless watchdog
      ansible.builtin.stat:
        path: /etc/systemd/system/mcloud-wireless-watchdog.timer
      register: devices_watchdog_timer
      when: not devices_watchdog | bool

    - name: Stop and disable the timer of the wireless watchdog
      ansible.builtin.systemd:
        name: mcloud-wireless-watchdog.timer
        enabled: false
        state: stopped
      when: not devices_watchdog | bool and devices_watchdog_timer.stat.exists

    - name: Remove the units of the wireless watchdog
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - mcloud-wireless-watchdog.service
        - mcloud-wireless-watchdog.timer
      when: not devices_watchdog | bool

# the containers of all the devices after a boot by AUTOSTART (README.md#autostart): mcloud-farm.service
- name: Deploy the autostart of the devices
  ansible.builtin.import_role:
    name: common
    tasks_from: autostart
  vars:
    common_autostart_os: linux

- name: Load the units of the devices
  ansible.builtin.systemd:
    daemon_reload: true
  tags: [devices, udev]

# WARNING: udevadm control --reload only re-reads the rules file.
#      It does NOT reapply rules to already-connected devices.
#      Re-plug affected devices manually, or run:
#      zebrunner-farm restart <device_udid>
- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload
  register: devices_udev_reload
  failed_when: devices_udev_reload.rc != 0
  changed_when: false
  tags: [devices, udev]

# the mode and the group of the rules for the USB devices plugged in already (a change event: no unit of the device
# starts); a device missing now gets them on its connection
- name: Apply the mode of the rules to the plugged USB devices
  ansible.builtin.command:
    argv:
      - udevadm
      - trigger
      - --action=change
      - --subsystem-match=usb
      - "--property-match=ID_SERIAL_SHORT={{ item.id | string | trim | replace('-', '') }}"
  loop: "{{ devices | selectattr('id', 'defined') | list }}"
  loop_control:
    label: "{{ item.name | default(item.id) }}"
  when: item.connection | default('usb') | string | lower == 'usb'
  changed_when: false
  failed_when: false
  tags: [devices, udev]

# the usbmuxd service may be absent: a failure is shown but does not stop the deploy
- name: Usbmuxd mask and stop  # noqa: ignore-errors
  ansible.builtin.systemd:
    name: usbmuxd
    masked: true
    state: stopped
  become: true
  ignore_errors: true
  tags: [devices, usbmuxd]

- name: ADB handling
  tags: [devices, adb]
  block:
    - name: ADB existence check
      ansible.builtin.command: which adb
      register: devices_adb_exists
      failed_when: false
      changed_when: false

    - name: ADB kill server
      ansible.builtin.command: adb kill-server
      register: devices_adb_kill
      failed_when: devices_adb_exists.rc == 0 and devices_adb_kill.rc != 0
      changed_when: false
      when: devices_adb_exists.rc == 0
      become: true
      ignore_errors: true

    # reports a running ADB server without stopping the deploy
    - name: ADB stop status  # noqa: ignore-errors
      ansible.builtin.assert:
        that:
          - devices_adb_exists.rc != 0 or devices_adb_kill.rc == 0
        success_msg: |
          {% if devices_adb_exists.rc != 0 %}
          ADB is not installed.
          {% else %}
          ADB stopped successfully.
          {% endif %}
        fail_msg: "Failed to stop ADB server!"
      ignore_errors: true
