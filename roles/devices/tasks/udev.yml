---
- name: Check OS compatibility
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == "Linux"
    fail_msg: "OS version is not compatible! This playbook supports Linux only."
    success_msg: "OS is compatible: {{ ansible_facts['system'] }}"
  tags: [devices, precheck]

- name: Check the settings and the devices
  ansible.builtin.import_role:
    name: common
    tasks_from: checks
  vars:
    common_os_role: devices
    common_usb_android_adb_port: false

# connection: usb (default), wireless, android-sim (an Android emulator) and proxy (iOS); the iOS simulators (ios-sim)
# run on a macOS host only
- name: Check the connection of each device
  vars:
    devices_connection: "{{ item.connection | default('usb') | string | lower }}"
  ansible.builtin.assert:
    that:
      - devices_connection in ['usb', 'wireless', 'android-sim', 'proxy']
      - devices_connection != 'android-sim' or item.os == 'android'
      - devices_connection != 'proxy' or item.os == 'ios'
      - devices_connection not in ['wireless', 'proxy'] or item.os == 'android' or (item.address | default('') | string | length) > 0
    fail_msg: >-
      Invalid connection '{{ devices_connection }}' of device '{{ item.name }}': usb, wireless (an iOS device needs address,
      its IP), android-sim (an Android emulator started outside the farm, address is its adb address) or proxy (iOS,
      needs address where its WebDriverAgent is published); the iOS simulators (ios-sim) run on a macOS host only.
    success_msg: "Device '{{ item.name }}' connection '{{ devices_connection }}' is valid."
    quiet: true
  loop: "{{ devices }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [devices, precheck, validate]

- name: Copy 'zebrunner-farm' script file
  ansible.builtin.template:
    src: zebrunner-farm
    dest: /usr/local/bin/zebrunner-farm
    # it has the secrets of the settings: root (udev) and the group of the user only
    mode: "0750"
    owner: root
    group: "{{ lookup('pipe', 'id -g') }}"
  tags: [devices, files]

- name: Copy rules file
  ansible.builtin.template:
    src: 90_mcloud.rules
    dest: /etc/udev/rules.d/90_mcloud.rules
    mode: "0644"
    owner: root
    group: root
  tags: [devices, udev, files]

# udev queues the jobs of these units for a connected or disconnected device (90_mcloud.rules)
- name: Copy the units of the devices
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  loop:
    - mcloud-device-restart@.service
    - mcloud-device-down@.service
  tags: [devices, udev, files]

- name: Load the units of the devices
  ansible.builtin.systemd:
    daemon_reload: true
  tags: [devices, udev]

- name: Copy devices details file
  ansible.builtin.template:
    src: mcloud-devices.txt
    dest: /usr/local/bin/mcloud-devices.txt
    mode: "0644"
    owner: root
    group: root
  tags: [devices, files]

# WARNING: udevadm control --reload only re-reads the rules file.
#      It does NOT reapply rules to already-connected devices.
#      Re-plug affected devices manually, or run:
#      zebrunner-farm restart <device_udid>
- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload
  register: devices_udev_reload
  failed_when: devices_udev_reload.rc != 0
  changed_when: false
  tags: [devices, udev]

# the usbmuxd service may be absent: a failure is shown but does not stop the deploy
- name: Usbmuxd mask and stop  # noqa: ignore-errors
  ansible.builtin.systemd:
    name: usbmuxd
    masked: true
    state: stopped
  become: true
  ignore_errors: true
  tags: [devices, usbmuxd]

- name: ADB handling
  tags: [devices, adb]
  block:
    - name: ADB existence check
      ansible.builtin.command: which adb
      register: devices_adb_exists
      failed_when: false
      changed_when: false

    - name: ADB kill server
      ansible.builtin.command: adb kill-server
      register: devices_adb_kill
      failed_when: devices_adb_exists.rc == 0 and devices_adb_kill.rc != 0
      changed_when: false
      when: devices_adb_exists.rc == 0
      become: true
      ignore_errors: true

    # reports a running ADB server without stopping the deploy
    - name: ADB stop status  # noqa: ignore-errors
      ansible.builtin.assert:
        that:
          - devices_adb_exists.rc != 0 or devices_adb_kill.rc == 0
        success_msg: |
          {% if devices_adb_exists.rc != 0 %}
          ADB is not installed.
          {% else %}
          ADB stopped successfully.
          {% endif %}
        fail_msg: "Failed to stop ADB server!"
      ignore_errors: true
