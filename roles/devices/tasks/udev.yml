---
- name: Check OS compatibility
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == "Linux"
    fail_msg: "OS version is not compatible! This playbook supports Linux only."
    success_msg: "OS is compatible: {{ ansible_facts['system'] }}"
  tags: [devices, precheck]

- name: Check setup completion
  ansible.builtin.assert:
    that:
      - lookup('file', 'roles/devices/vars/main.yml', errors='ignore') is not none
    fail_msg: "You have to set up services in advance using: ./zebrunner.sh setup!"
    success_msg: "Setup is ready: 'roles/devices/vars/main.yml' exists."
  tags: [devices, precheck]

- name: Check 'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable
  ansible.builtin.assert:
    that:
      - lookup('env', 'ZEBRUNNER_MCLOUD_AGENT_DIR') | length > 0
    fail_msg: "You have to set up 'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable in advance!"
    success_msg: "'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable is defined."
  tags: [devices, precheck]

- name: Collect all device IDs and names
  ansible.builtin.set_fact:
    devices_all_ids: "{{ devices | map(attribute='id') | map('trim') | list }}"
    devices_all_names: "{{ devices | map(attribute='name') | map('trim') | map('regex_replace', '\\s+', '_') | list }}"
  tags: [devices, precheck, dedup]

- name: Count occurrences of each device id
  ansible.builtin.set_fact:
    devices_id_counts: "{{ devices_id_counts | default({}) | combine({item: (devices_id_counts | default({}))[item] | default(0) + 1}) }}"
  loop: "{{ devices_all_ids }}"
  tags: [devices, precheck, dedup]

- name: Count occurrences of each device name
  ansible.builtin.set_fact:
    devices_name_counts: "{{ devices_name_counts | default({}) | combine({item: (devices_name_counts | default({}))[item] | default(0) + 1}) }}"
  loop: "{{ devices_all_names }}"
  tags: [devices, precheck, dedup]

- name: Determine duplicate ids
  ansible.builtin.set_fact:
    devices_dup_ids: "{{ devices_id_counts | dict2items | selectattr('value', '>', 1) | map(attribute='key') | list }}"
  tags: [devices, precheck, dedup]

- name: Determine duplicate names
  ansible.builtin.set_fact:
    devices_dup_names: "{{ devices_name_counts | dict2items | selectattr('value', '>', 1) | map(attribute='key') | list }}"
  tags: [devices, precheck, dedup]

- name: Check for duplicate device IDs or names
  ansible.builtin.assert:
    that:
      - devices_dup_ids | length == 0
      - devices_dup_names | length == 0
    fail_msg: "Duplicate devices found! Duplicate IDs: {{ devices_dup_ids }} Duplicate Names: {{ devices_dup_names }}"
    success_msg: "All device IDs and names are unique."
  tags: [devices, precheck, dedup]

# the ZeroMQ security of STF: the key of this host with the key of the server (README.md#zeromq-security)
- name: Check the CURVE keys of ZeroMQ
  vars:
    curve_server_key: "{{ STF_ZMQ_CURVE_SERVER_PUBLIC_KEY | default('', true) | string }}"
    curve_secret_key: "{{ STF_ZMQ_CURVE_SECRET_KEY | default('', true) | string }}"
  ansible.builtin.assert:
    that:
      - curve_server_key | length == 0 or curve_server_key is match('^[0-9a-fA-F]{64}$')
      - curve_server_key | length == 0 or curve_secret_key is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      STF_ZMQ_CURVE_SERVER_PUBLIC_KEY must be the 64 hex characters of the STF server (in quotes) and it needs
      STF_ZMQ_CURVE_SECRET_KEY, the key of this host: run ./zebrunner.sh curve-key.
    success_msg: "{{ 'ZeroMQ of STF with CURVE.' if curve_server_key else 'ZeroMQ of STF without CURVE.' }}"
  tags: [devices, precheck, validate]

- name: Check obligatory settings of each device
  ansible.builtin.assert:
    that:
      - item.id is defined and item.name is defined
      - item.os is defined and item.os in ['android', 'ios']
      - item.appium_port is defined and item.adb_port is defined and item.min_port is defined and item.max_port is defined
      - 0 < (item.appium_port | int) < 65536
      - 0 < (item.min_port | int) <= (item.max_port | int) < 65536
    fail_msg: >-
      Invalid settings of device '{{ item.name | default(item.id) | default('?') }}':
      id, name, os (android or ios), appium_port, adb_port, min_port and max_port are obligatory,
      ports are 1-65535 and min_port is not greater than max_port.
    success_msg: "Device '{{ item.name | default(item.id) | default('?') }}' settings are valid."
    quiet: true
  loop: "{{ devices }}"
  loop_control:
    label: "{{ item.name | default(item.id) | default('?') }}"
  tags: [devices, precheck, validate]

# connection: usb (default), wireless (the earlier wireless: true), android-sim (an Android emulator) and proxy (iOS);
# the iOS simulators (ios-sim) run on a macOS host only
- name: Check the connection of each device
  vars:
    devices_wireless: "{{ (item.wireless | default(false) | string | lower) == 'true' }}"
    devices_connection: "{{ (item.connection | default('wireless' if devices_wireless | bool else 'usb')) | string | lower }}"
  ansible.builtin.assert:
    that:
      - devices_connection in ['usb', 'wireless', 'android-sim', 'proxy']
      - devices_connection != 'android-sim' or item.os == 'android'
      - devices_connection != 'proxy' or item.os == 'ios'
      - devices_connection not in ['wireless', 'proxy'] or item.os == 'android' or (item.address | default('') | string | length) > 0
    fail_msg: >-
      Invalid connection '{{ devices_connection }}' of device '{{ item.name }}': usb, wireless (an iOS device needs address,
      its IP), android-sim (an Android emulator started outside the farm, address is its adb address) or proxy (iOS,
      needs address where its WebDriverAgent is published); the iOS simulators (ios-sim) run on a macOS host only.
    success_msg: "Device '{{ item.name }}' connection '{{ devices_connection }}' is valid."
    quiet: true
  loop: "{{ devices }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [devices, precheck, validate]

# appium_port and the min_port-max_port range are published on the host, other ports stay in the containers
- name: Collect host ports published by each device
  ansible.builtin.set_fact:
    devices_ports: "{{ (devices_ports | default([])) + [[item.appium_port | int] + range(item.min_port | int, (item.max_port | int) + 1) | list] }}"
  loop: "{{ devices }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [devices, precheck, validate]

- name: Check that devices do not share host ports
  vars:
    other_ports: "{{ (devices_ports[:idx] + devices_ports[idx + 1 :]) | flatten }}"
    own_range: "{{ range(item.min_port | int, (item.max_port | int) + 1) | list }}"
    shared_ports: "{{ devices_ports[idx] | intersect(other_ports) | union([item.appium_port | int] | intersect(own_range)) }}"
  ansible.builtin.assert:
    that: shared_ports | length == 0
    fail_msg: >-
      Host ports {{ shared_ports }} of device '{{ item.name }}' are used by another device
      or by both its appium_port and min_port-max_port range.
    success_msg: "Host ports of device '{{ item.name }}' are not shared."
    quiet: true
  loop: "{{ devices }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"
  tags: [devices, precheck, validate]

- name: Copy 'zebrunner-farm' script file
  ansible.builtin.template:
    src: zebrunner-farm
    dest: /usr/local/bin/zebrunner-farm
    mode: "0755"
    owner: root
    group: root
  tags: [devices, files]

- name: Copy rules file
  ansible.builtin.template:
    src: 90_mcloud.rules
    dest: /etc/udev/rules.d/90_mcloud.rules
    mode: "0644"
    owner: root
    group: root
  tags: [devices, udev, files]

# udev queues the jobs of these units for a connected or disconnected device (90_mcloud.rules)
- name: Copy the units of the devices
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  loop:
    - mcloud-device-restart@.service
    - mcloud-device-down@.service
  tags: [devices, udev, files]

- name: Load the units of the devices
  ansible.builtin.systemd:
    daemon_reload: true
  tags: [devices, udev]

- name: Copy devices details file
  ansible.builtin.template:
    src: mcloud-devices.txt
    dest: /usr/local/bin/mcloud-devices.txt
    mode: "0644"
    owner: root
    group: root
  tags: [devices, files]

# WARNING: udevadm control --reload only re-reads the rules file.
#      It does NOT reapply rules to already-connected devices.
#      Re-plug affected devices manually, or run:
#      zebrunner-farm restart <device_udid>
- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload
  register: devices_udev_reload
  failed_when: devices_udev_reload.rc != 0
  changed_when: false
  tags: [devices, udev]

# the usbmuxd service may be absent: a failure is shown but does not stop the deploy
- name: Usbmuxd mask and stop  # noqa: ignore-errors
  ansible.builtin.systemd:
    name: usbmuxd
    masked: true
    state: stopped
  become: true
  ignore_errors: true
  tags: [devices, usbmuxd]

- name: ADB handling
  tags: [devices, adb]
  block:
    - name: ADB existence check
      ansible.builtin.command: which adb
      register: devices_adb_exists
      failed_when: false
      changed_when: false

    - name: ADB kill server
      ansible.builtin.command: adb kill-server
      register: devices_adb_kill
      failed_when: devices_adb_exists.rc == 0 and devices_adb_kill.rc != 0
      changed_when: false
      when: devices_adb_exists.rc == 0
      become: true
      ignore_errors: true

    # reports a running ADB server without stopping the deploy
    - name: ADB stop status  # noqa: ignore-errors
      ansible.builtin.assert:
        that:
          - devices_adb_exists.rc != 0 or devices_adb_kill.rc == 0
        success_msg: |
          {% if devices_adb_exists.rc != 0 %}
          ADB is not installed.
          {% else %}
          ADB stopped successfully.
          {% endif %}
        fail_msg: "Failed to stop ADB server!"
      ignore_errors: true
