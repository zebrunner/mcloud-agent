---

- name: Check OS compatibility
  assert:
    that:
      - ansible_facts['system'] == "Linux"
    fail_msg: "OS version is not compatible! This playbook supports Linux only."
    success_msg: "OS is compatible: {{ ansible_facts['system'] }}"
  tags: [devices, precheck]

- name: Check setup completion
  assert:
    that:
      - lookup('file', 'roles/devices/vars/main.yml', errors='ignore') is not none
    fail_msg: "You have to set up services in advance using: ./zebrunner.sh setup!"
    success_msg: "Setup is ready: 'roles/devices/vars/main.yml' exists."
  tags: [devices, precheck]

- name: Check 'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable
  assert:
    that:
      - lookup('env','ZEBRUNNER_MCLOUD_AGENT_DIR') | length > 0
    fail_msg: "You have to set up 'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable in advance!"
    success_msg: "'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable is defined."
  tags: [devices, precheck]

- name: Collect all device IDs and names
  set_fact:
    all_ids: "{{ devices | map(attribute='id') | map('trim') | list }}"
    all_names: "{{ devices | map(attribute='name') | map('trim') | map('regex_replace', '\\s+', '_') | list }}"
  tags: [devices, precheck, dedup]

- name: Count occurrences of each device id
  set_fact:
    id_counts: "{{ id_counts | default({}) | combine({item: (id_counts | default({}) )[item] | default(0) + 1}) }}"
  loop: "{{ all_ids }}"
  tags: [devices, precheck, dedup]

- name: Count occurrences of each device name
  set_fact:
    name_counts: "{{ name_counts | default({}) | combine({item: (name_counts | default({}))[item] | default(0) + 1}) }}"
  loop: "{{ all_names }}"
  tags: [devices, precheck, dedup]

- name: Determine duplicate ids
  set_fact:
    dup_ids: "{{ id_counts | dict2items | selectattr('value', '>', 1) | map(attribute='key') | list }}"
  tags: [devices, precheck, dedup]

- name: Determine duplicate names
  set_fact:
    dup_names: "{{ name_counts | dict2items | selectattr('value', '>', 1) | map(attribute='key') | list }}"
  tags: [devices, precheck, dedup]

- name: Check for duplicate device IDs or names
  assert:
    that:
      - dup_ids | length == 0
      - dup_names | length == 0
    fail_msg: "Duplicate devices found! Duplicate IDs: {{ dup_ids }} Duplicate Names: {{ dup_names }}"
    success_msg: "All device IDs and names are unique."
  tags: [devices, precheck, dedup]

- name: Check obligatory settings of each device
  assert:
    that:
      - item.id is defined and item.name is defined
      - item.os is defined and item.os in ['android', 'ios']
      - item.appium_port is defined and item.adb_port is defined and item.min_port is defined and item.max_port is defined
      - 0 < (item.appium_port | int) < 65536
      - 0 < (item.min_port | int) <= (item.max_port | int) < 65536
    fail_msg: >-
      Invalid settings of device '{{ item.name | default(item.id) | default('?') }}':
      id, name, os (android or ios), appium_port, adb_port, min_port and max_port are obligatory,
      ports are 1-65535 and min_port is not greater than max_port.
    success_msg: "Device '{{ item.name | default(item.id) | default('?') }}' settings are valid."
    quiet: true
  loop: "{{ devices }}"
  loop_control:
    label: "{{ item.name | default(item.id) | default('?') }}"
  tags: [devices, precheck, validate]

# appium_port and the min_port-max_port range are published on the host, other ports stay in the containers
- name: Collect host ports published by each device
  set_fact:
    devices_ports: "{{ (devices_ports | default([])) + [[item.appium_port | int] + range(item.min_port | int, (item.max_port | int) + 1) | list] }}"
  loop: "{{ devices }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [devices, precheck, validate]

- name: Check that devices do not share host ports
  vars:
    other_ports: "{{ (devices_ports[:idx] + devices_ports[idx + 1:]) | flatten }}"
    own_range: "{{ range(item.min_port | int, (item.max_port | int) + 1) | list }}"
    shared_ports: "{{ devices_ports[idx] | intersect(other_ports) | union([item.appium_port | int] | intersect(own_range)) }}"
  assert:
    that: shared_ports | length == 0
    fail_msg: >-
      Host ports {{ shared_ports }} of device '{{ item.name }}' are used by another device
      or by both its appium_port and min_port-max_port range.
    success_msg: "Host ports of device '{{ item.name }}' are not shared."
    quiet: true
  loop: "{{ devices }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"
  tags: [devices, precheck, validate]

- name: Copy 'zebrunner-farm' script file
  template:
    src: zebrunner-farm
    dest: /usr/local/bin/zebrunner-farm
    mode: '0755'
    owner: root
    group: root
  tags: [devices, files]

- name: Copy rules file
  template:
    src: 90_mcloud.rules
    dest: /etc/udev/rules.d/90_mcloud.rules
    mode: '0644'
    owner: root
    group: root
  tags: [devices, udev, files]

- name: Copy devices details file
  template:
    src: mcloud-devices.txt
    dest: /usr/local/bin/mcloud-devices.txt
    mode: '0644'
    owner: root
    group: root
  tags: [devices, files]

# WARNING: udevadm control --reload only re-reads the rules file.
#      It does NOT reapply rules to already-connected devices.
#      Re-plug affected devices manually, or run:
#      zebrunner-farm restart <device_udid>
- name: Reload udev rules
  command: udevadm control --reload
  register: udev_reload
  failed_when: udev_reload.rc != 0
  changed_when: false
  tags: [devices, udev]

- name: Usbmuxd mask and stop
  systemd:
    name: usbmuxd
    masked: true
    state: stopped
  become: true
  ignore_errors: true
  tags: [devices, usbmuxd]

- name: ADB handling
  block:
    - name: ADB existence check
      command: which adb
      register: adb_exists
      failed_when: false
      changed_when: false

    - name: ADB kill server
      command: adb kill-server
      register: adb_kill
      failed_when: adb_exists.rc == 0 and adb_kill.rc != 0
      changed_when: false
      when: adb_exists.rc == 0
      become: true
      ignore_errors: true

    - name: ADB stop status
      assert:
        that:
          - adb_exists.rc != 0 or adb_kill.rc == 0
        success_msg: |
          {% if adb_exists.rc != 0 %}
          ADB is not installed.
          {% else %}
          ADB stopped successfully.
          {% endif %}
        fail_msg: "Failed to stop ADB server!"
      ignore_errors: true
  tags: [devices, adb]
