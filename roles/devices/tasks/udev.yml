---

- name: Check OS compatibility
  ansible.builtin.assert:
    that:
      - ansible_system == "Linux"
    fail_msg: "OS version is not compatible! This playbook supports Linux only."
    success_msg: "OS is compatible: {{ ansible_system }}"

- name: Check if 'roles/devices/vars/main.yml' file exists
  stat:
    path: roles/devices/vars/main.yml
  register: main_yml

- name: Verify setup prerequisites
  ansible.builtin.assert:
    that:
      - main_yml.stat.exists
    fail_msg: "You have to setup services in advance using: ./zebrunner.sh setup!"
    success_msg: "Setup file 'roles/devices/vars/main.yml' exists."

- name: Copy script to launch container with Appium for device
  ansible.builtin.template:
    src: zebrunner-farm
    dest: /usr/local/bin/zebrunner-farm
    mode: '0755'
    owner: root
    group: root

- name: Copy udev rules for device script
  ansible.builtin.template:
    src: 90_mcloud.rules
    dest: /etc/udev/rules.d/90_mcloud.rules
    mode: '0644'
    owner: root
    group: root

- name: Copy devices details file
  ansible.builtin.template:
    src: mcloud-devices.txt
    dest: /usr/local/bin/mcloud-devices.txt
    mode: '0644'
    owner: root
    group: root

- name: Reload udev rules
  command: udevadm control --reload
  register: udev_reload
  failed_when: udev_reload.rc != 0
  changed_when: false

- name: Ensure usbmuxd is masked and stopped
  ansible.builtin.systemd:
    name: usbmuxd
    masked: yes
    state: stopped
  become: true
  ignore_errors: yes

- name: Stop ADB server
  block:
    - name: Check if ADB exists
      command: which adb
      register: adb_exists
      failed_when: false
      changed_when: false

    - name: Stop ADB server
      command: adb kill-server
      register: adb_kill
      failed_when: adb_exists.rc == 0 and adb_kill.rc != 0
      changed_when: false
      when: adb_exists.rc == 0
      become: true
      ignore_errors: yes

    - name: ADB stop status
      assert:
        that:
          - adb_exists.rc != 0 or adb_kill.rc == 0
        success_msg: |
          {% if adb_exists.rc != 0 %}
          ADB is not installed.
          {% else %}
          ADB server stopped successfully.
          {% endif %}
        fail_msg: "Failed to stop ADB server!"
      ignore_errors: yes

- name: ADB stop status
  assert:
    that:
      - adb_exists.rc != 0 or adb_kill.rc == 0
    success_msg: |
      {% if adb_exists.rc != 0 %}
      ADB is not installed.
      {% else %}
      ADB server stopped successfully.
      {% endif %}
    fail_msg: "Failed to stop ADB server!"
  ignore_errors: yes