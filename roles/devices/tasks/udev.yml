---
- name: Check OS compatibility
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == "Linux"
    fail_msg: "OS version is not compatible! This playbook supports Linux only."
    success_msg: "OS is compatible: {{ ansible_facts['system'] }}"
  tags: [devices, precheck]

- name: Check the settings and the devices
  ansible.builtin.import_role:
    name: common
    tasks_from: checks
  vars:
    common_os_role: devices
    common_os: linux

# the settings have the secrets of the host: root (udev) and the group of the user only
- name: Deploy 'zebrunner-farm'
  ansible.builtin.import_role:
    name: common
    tasks_from: farm
  vars:
    common_farm_os: linux
    common_farm_owner: root
    common_farm_group: "{{ lookup('pipe', 'id -g') }}"
    common_farm_env_mode: "0640"

- name: Copy rules file
  ansible.builtin.template:
    src: 90_mcloud.rules
    dest: /etc/udev/rules.d/90_mcloud.rules
    mode: "0644"
    owner: root
    group: root
  tags: [devices, udev, files]

# udev queues the jobs of these units for a connected or disconnected device (90_mcloud.rules)
- name: Copy the units of the devices
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  loop:
    - mcloud-device-restart@.service
    - mcloud-device-down@.service
  tags: [devices, udev, files]

- name: Load the units of the devices
  ansible.builtin.systemd:
    daemon_reload: true
  tags: [devices, udev]

- name: Copy devices details file
  ansible.builtin.template:
    src: mcloud-devices.txt
    dest: /usr/local/bin/mcloud-devices.txt
    mode: "0644"
    owner: root
    group: root
  tags: [devices, files]

# WARNING: udevadm control --reload only re-reads the rules file.
#      It does NOT reapply rules to already-connected devices.
#      Re-plug affected devices manually, or run:
#      zebrunner-farm restart <device_udid>
- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload
  register: devices_udev_reload
  failed_when: devices_udev_reload.rc != 0
  changed_when: false
  tags: [devices, udev]

# the usbmuxd service may be absent: a failure is shown but does not stop the deploy
- name: Usbmuxd mask and stop  # noqa: ignore-errors
  ansible.builtin.systemd:
    name: usbmuxd
    masked: true
    state: stopped
  become: true
  ignore_errors: true
  tags: [devices, usbmuxd]

- name: ADB handling
  tags: [devices, adb]
  block:
    - name: ADB existence check
      ansible.builtin.command: which adb
      register: devices_adb_exists
      failed_when: false
      changed_when: false

    - name: ADB kill server
      ansible.builtin.command: adb kill-server
      register: devices_adb_kill
      failed_when: devices_adb_exists.rc == 0 and devices_adb_kill.rc != 0
      changed_when: false
      when: devices_adb_exists.rc == 0
      become: true
      ignore_errors: true

    # reports a running ADB server without stopping the deploy
    - name: ADB stop status  # noqa: ignore-errors
      ansible.builtin.assert:
        that:
          - devices_adb_exists.rc != 0 or devices_adb_kill.rc == 0
        success_msg: |
          {% if devices_adb_exists.rc != 0 %}
          ADB is not installed.
          {% else %}
          ADB stopped successfully.
          {% endif %}
        fail_msg: "Failed to stop ADB server!"
      ignore_errors: true
