---
# The values by default of the settings of both OS: config/settings.yml overrides them (README.md#settings)

# Put true to disable app size check using local appium storage
APPIUM_APP_SIZE_DISABLE: false

# Put false to forbid insecure appium features by starting appium without --relaxed-security. true enables them for
# APPIUM_RELAXED_SECURITY enables ALL insecure Appium features for every session, including get_server_logs, which
# returns the Appium log of the earlier sessions of the device (another user's capabilities and inputs). It is off by
# default; the features the tests usually need are enabled granularly instead (below). Set it to true only for a feature
# not covered by those: the emulator console, the screen streaming, get_server_logs (README.md#appium-security).
APPIUM_RELAXED_SECURITY: false

# mobile: shell (adb shell of the device) for the tests: a granular insecure feature of Appium, enabled without the
# blanket APPIUM_RELAXED_SECURITY
APPIUM_ADB_SHELL: true

# the automatic download of the matching chromedriver for the web and hybrid tests: a granular insecure feature of Appium
APPIUM_CHROMEDRIVER_AUTODOWNLOAD: true

# The cleanup between the uses of a device (README.md#cleanup): empty keeps the default of mcloud-device (on: the apps
# installed during a use are uninstalled when the device is released, the helpers of the farm stay), true or false
STF_PROVIDER_CLEANUP: ''
# more apps the cleanup keeps on this host: ids or prefixes ending with *, separated by commas
CLEANUP_KEEP_PACKAGES: ''
# the networks the port forwards of the users of STF may reach from this host besides the public addresses (README.md#port-forwarding)
STF_FORWARD_ALLOW: ''

# Optimized app verifications for AppCenter and AWS S3 storages
APPIUM_APP_FETCH_RETRIES: 2
APPIUM_MAX_LOCK_FILE_LIFETIME: 180
APPIUM_APP_WAITING_TIMEOUT: 90

RESTARTS_LIMIT: 50

# How long in seconds an iOS device (usb, wireless) may stay unavailable before its connector stops
# (DEVICE_UNAVAILABLE_TIMEOUT of mcloud-ios-connector, 600 by default; 0: forever): empty is the default of the
# connector, unavailable_timeout of a device overrides it. A wireless device is awaited that long (README.md#wireless-devices)
DEVICE_UNAVAILABLE_TIMEOUT:

# The wireless watchdog (README.md#wireless-watchdog): on a host with wireless devices the containers of the wireless
# devices that stopped by themselves are started every this many seconds; 0: off
WIRELESS_WATCHDOG_INTERVAL: 300

# every device has a docker network of its own (README.md#docker-network): its containers reach only its connector; the
# networks are /28 subnets of DEVICE_NETWORK_SUBNETS. false: the containers of all the devices share STF_DOCKER_NETWORK
DEVICE_NETWORK_ISOLATION: true
DEVICE_NETWORK_SUBNETS: 10.233.0.0/16
# the shared docker network of DEVICE_NETWORK_ISOLATION=false, the deploy and zebrunner-farm create it
STF_DOCKER_NETWORK: infra
# the peer filter of the connectors (README.md#docker-network): only the stf and appium containers of a device open
# connections to its connector (CONNECTOR_PEERS of the connectors, the container gets NET_ADMIN for its own packet
# filter); false: every host of the network of the device reaches its connector
CONNECTOR_PEER_FILTER: true

# The WireGuard tunnel to MCloud (README.md#wireguard-tunnel), off by default: ./zebrunner.sh join writes these settings
# when MCloud has the tunnel on. The deploy sets up the interface mcloud-node of this host with them, zebrunner-farm
# publishes the ports of the devices on WG_ADDRESS only
WG_ENABLED: false
WG_PRIVATE_KEY: ""
WG_ADDRESS: ""
WG_SERVER_ADDRESS: ""
WG_SERVER_PUBLIC_KEY: ""
WG_ENDPOINT: ""
WG_NETWORK: ""
# the node keeps its NAT open for the handshakes of MCloud
WG_PERSISTENT_KEEPALIVE: 25

# the optional settings of config/settings.yml.original, empty: off (an empty WDA_FILE and WDA_BUNDLEID are the values
# by default of zebrunner-farm)
STF_API_URL: ""
# true: the containers of STF do not verify the certificate of MCloud (README.md#tls-of-mcloud), only for a self-signed
# certificate of another name than PUBLIC_IP; doctor fails with it unless STF_TLS_INSECURE_ACKNOWLEDGED is true too
STF_TLS_INSECURE: false
STF_TLS_INSECURE_ACKNOWLEDGED: false
# the containers of STF send the node token only to the pinned TLS key of MCloud (MCLOUD_TLS_PIN of the join string)
# for a self-signed or private-CA certificate and with STF_TLS_INSECURE; the deploy decides it, a certificate of a public
# CA valid for PUBLIC_IP is not pinned, also not by doctor and mdm (README.md#tls-of-mcloud). false: no pin for STF
STF_TLS_PIN: true
S3_BUCKET: ""
S3_TENANT: ""
S3_ENDPOINT: ""
S3_ACCESS_KEY_ID: ""
S3_SECRET: ""
S3_REGION: ""
WDA_FILE: ""
WDA_BUNDLEID: ""

# the supervision identity of the farm (a PKCS#12 file of the host and its password): ./zebrunner.sh mdm supervises the
# iOS devices with it and installs their enrollment profiles, no prompt on a supervised device (README.md#mdm); the
# organization of the supervision and the Wi-Fi an erased device joins (Any, WPA, WPA2, WPA3, None)
MDM_SUPERVISION_P12: ""
MDM_SUPERVISION_P12_PASSWORD: ""
MDM_SUPERVISION_ORG: "Zebrunner MCloud"
MDM_WIFI_SSID: ""
MDM_WIFI_PASSWORD: ""
MDM_WIFI_ENCRYPTION: "Any"

# The Developer Disk Images of the iOS devices (README.md#developer-disk-images): the deploy of a host with iOS devices
# clones DDI_REPO at DDI_VERSION (a branch or a tag) into DDI_DIR (DeveloperDiskImages of the agent folder when empty),
# zebrunner-farm mounts it into the iOS connectors read-only; false leaves the images to the download of go-ios
DDI_ENABLED: true
DDI_REPO: https://github.com/zebrunner/DeveloperDiskImage.git
DDI_VERSION: main
DDI_DIR:

# The address WebDriverAgent of the iOS devices listens on (WDA_BIND_ADDRESS of mcloud-ios-connector): empty is auto of
# the connector (the loopback of the device for usb, of the host for a simulator), all: every interface
WDA_BIND_ADDRESS:
