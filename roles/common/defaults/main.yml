---
# The values by default of the settings of both OS: config/settings.yml overrides them (README.md#settings)

# Put true to disable app size check using local appium storage
APPIUM_APP_SIZE_DISABLE: false

# Put false to forbid insecure appium features by starting appium without --relaxed-security. true enables them for
# every session: mobile: shell (adb shell of the device), the Appium log of the earlier sessions of the device
# (get_server_logs), the emulator console, the screen streaming, the download of chromedriver (README.md#appium-security)
APPIUM_RELAXED_SECURITY: true

# Optimized app verifications for AppCenter and AWS S3 storages
APPIUM_APP_FETCH_RETRIES: 2
APPIUM_MAX_LOCK_FILE_LIFETIME: 180
APPIUM_APP_WAITING_TIMEOUT: 90

RESTARTS_LIMIT: 50

# The Developer Disk Images of the iOS devices (README.md#developer-disk-images): the deploy of a host with iOS devices
# clones DDI_REPO at DDI_VERSION (a branch or a tag) into DDI_DIR (DeveloperDiskImages of the agent folder when empty),
# zebrunner-farm mounts it into the iOS connectors read-only; false leaves the images to the download of go-ios
DDI_ENABLED: true
DDI_REPO: https://github.com/zebrunner/DeveloperDiskImage.git
DDI_VERSION: main
DDI_DIR:
