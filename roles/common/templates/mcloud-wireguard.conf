# The WireGuard tunnel of this host to MCloud (README.md#wireguard-tunnel): ./zebrunner.sh ansible renders it from the
# settings of ./zebrunner.sh join (WG_*), do not change it here. It has the private key of this host: root only.
[Interface]
PrivateKey = {{ WG_PRIVATE_KEY }}
Address = {{ WG_ADDRESS }}/32

# MCloud: only its address goes through the tunnel; the node dials in and keeps its NAT open
[Peer]
PublicKey = {{ WG_SERVER_PUBLIC_KEY }}
Endpoint = {{ WG_ENDPOINT }}
AllowedIPs = {{ WG_SERVER_ADDRESS }}/32
PersistentKeepalive = {{ WG_PERSISTENT_KEEPALIVE | default(25, true) | int }}
