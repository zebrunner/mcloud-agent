---
# zebrunner-farm of both OS (README.md#devices-management): the same script and its settings, the env file with the
# secrets of the host; imported by the roles of the OS (import_role tasks_from: farm) with:
#   common_farm_os: linux or macos
#   common_farm_owner and common_farm_group: the owner of the files
#   common_farm_env_mode: the mode of the settings, readable by the user of the deploy and udev (root) or launchd only
#   common_farm_lib_dir (optional): the folder of the scripts zebrunner-farm sources, /usr/local/lib/zebrunner-farm

- name: Copy 'zebrunner-farm' script file
  ansible.builtin.copy:
    src: zebrunner-farm
    dest: /usr/local/bin/zebrunner-farm
    mode: "0755"
    owner: "{{ common_farm_owner }}"
    group: "{{ common_farm_group }}"
  tags: [devices, files]

# the scripts zebrunner-farm sources and runs (ZEBRUNNER_FARM_LIB of its settings): copies owned by root, the units of
# udev run it as root (and doctor usb-stats may run with sudo), the clone of the agent is writable by the user
- name: Create the folder of the scripts of 'zebrunner-farm'
  ansible.builtin.file:
    path: "{{ common_farm_lib_dir | default('/usr/local/lib/zebrunner-farm', true) }}"
    state: directory
    mode: "0755"
    owner: root
    group: "{{ 'wheel' if common_farm_os == 'macos' else 'root' }}"
  tags: [devices, files]

- name: Copy the scripts 'zebrunner-farm' sources and runs
  ansible.builtin.copy:
    src: "{{ agent_dir }}/patch/{{ item }}"
    dest: "{{ common_farm_lib_dir | default('/usr/local/lib/zebrunner-farm', true) }}/{{ item }}"
    mode: "0644"
    owner: root
    group: "{{ 'wheel' if common_farm_os == 'macos' else 'root' }}"
  loop:
    - utility.sh
    - ui.sh
    - usb_stats.py
    - usb_map.py
  tags: [devices, files]

- name: Create the folder of the settings of 'zebrunner-farm'
  ansible.builtin.file:
    path: /usr/local/etc
    state: directory
    mode: "0755"
  tags: [devices, files]

# the certificate of MCloud the containers of STF trust (README.md#tls-of-mcloud): none for a certificate of a public CA,
# the pinned one of the join string (MCLOUD_TLS_PIN) for a self-signed or private-CA one, MCLOUD_CA_PEM of
# zebrunner-farm.env. With STF_TLS_INSECURE and STF_TLS_PIN the containers verify the pinned key only (--pin-only: the
# key, not the chain and the name)
- name: Find the certificate of MCloud the containers of STF trust
  ansible.builtin.command:
    argv: >-
      {{ [ansible_playbook_python, agent_dir ~ '/patch/tlstrust.py', PUBLIC_IP | string, PUBLIC_IP_PORT | string,
          MCLOUD_TLS_PIN | default('', true) | string]
         + (['--pin-only'] if STF_TLS_INSECURE | bool else []) }}
  register: common_farm_tls
  changed_when: false
  failed_when: false
  check_mode: false
  delegate_to: localhost
  become: false
  when: >-
    PUBLIC_IP_PROTOCOL == 'https'
    and (not STF_TLS_INSECURE | bool or (STF_TLS_PIN | bool and MCLOUD_TLS_PIN | default('', true) | length > 0))
  tags: [devices, files]

# the pin of the TLS key (STF_TLS_PIN), decided here: only for a self-signed or private-CA certificate (tlstrust.py
# printed the pinned chain) or with STF_TLS_INSECURE. A certificate a public CA signs for PUBLIC_IP (common_farm_tls_public)
# is verified with the CAs of the system, without the pin, by the containers of STF, doctor and mdm: a renewal with a
# new key keeps the nodes working
- name: Decide the pin of the TLS key of MCloud for the containers of STF
  ansible.builtin.set_fact:
    common_farm_tls_public: >-
      {{ PUBLIC_IP_PROTOCOL == 'https' and not STF_TLS_INSECURE | bool and common_farm_tls.rc | default(1) == 0
         and common_farm_tls.stdout | default('', true) | length == 0 }}
    common_farm_tls_pinned: >-
      {{ PUBLIC_IP_PROTOCOL == 'https' and STF_TLS_PIN | bool and MCLOUD_TLS_PIN | default('', true) | length > 0
         and common_farm_tls.rc | default(1) == 0
         and (STF_TLS_INSECURE | bool or common_farm_tls.stdout | default('', true) | length > 0) }}
  tags: [devices, files]

- name: Check the certificate of MCloud
  ansible.builtin.assert:
    that: common_farm_tls is skipped or common_farm_tls.rc == 0
    fail_msg: "{{ common_farm_tls.stderr | default('') }}"
    success_msg: >-
      {{ ('STF_TLS_INSECURE: the containers of STF do not verify the certificate of MCloud'
          ~ (', they send the node token to its pinned key only' if common_farm_tls_pinned | bool else ''))
         if STF_TLS_INSECURE | bool
         else ('the containers of STF trust the pinned certificate of MCloud' if common_farm_tls.stdout | default('')
               else 'the containers of STF verify the certificate of MCloud')
              ~ (' and send the node token to its pinned key only' if common_farm_tls_pinned | bool else '') }}
  tags: [devices, files]

- name: Report a public certificate of MCloud
  ansible.builtin.debug:
    msg: >-
      public certificate, TLS pin not used: a public CA signs the certificate of MCloud for {{ PUBLIC_IP }}, the containers
      of STF, doctor and mdm verify it with the CAs of the system, a renewal with a new key keeps working
      (README.md#tls-of-mcloud)
  when: common_farm_tls_public | bool and MCLOUD_TLS_PIN | default('', true) | length > 0
  tags: [devices, files]

# reported, the deploy goes on: ./zebrunner.sh doctor fails with it unless it is acknowledged
- name: Report STF_TLS_INSECURE  # noqa: ignore-errors
  ansible.builtin.assert:
    that: not STF_TLS_INSECURE | bool or STF_TLS_INSECURE_ACKNOWLEDGED | bool
    fail_msg: >-
      STF_TLS_INSECURE: the containers of STF do not verify the certificate of MCloud. Use the name or the address of
      the certificate in PUBLIC_IP and STF_TLS_INSECURE: false, or acknowledge it with STF_TLS_INSECURE_ACKNOWLEDGED: true
      (README.md#tls-of-mcloud)
    quiet: true
  ignore_errors: true
  tags: [devices, files]

- name: Copy 'zebrunner-farm' settings file
  ansible.builtin.template:
    src: zebrunner-farm.env
    dest: /usr/local/etc/zebrunner-farm.env
    mode: "{{ common_farm_env_mode }}"
    owner: "{{ common_farm_owner }}"
    group: "{{ common_farm_group }}"
  tags: [devices, files]

# the devices of zebrunner-farm (and of the units of udev of Linux): readable by every user, no secret
- name: Copy devices details file
  ansible.builtin.template:
    src: mcloud-devices.txt
    dest: /usr/local/bin/mcloud-devices.txt
    mode: "0644"
    owner: root
    group: "{{ 'wheel' if common_farm_os == 'macos' else 'root' }}"
  tags: [devices, files]

# the completion of zebrunner-farm (and ./zebrunner.sh) in bash, patch/completion.sh (README.md#completion): in the
# folder of bash-completion of the system on Linux, of Homebrew of the user on macOS; only when the folder exists:
# nothing loads it without bash-completion. common_farm_completion_dir overrides the folder (the tests); zsh evals
# `zebrunner-farm completion zsh` in ~/.zshrc instead
- name: Find the prefix of Homebrew
  ansible.builtin.shell: PATH="/opt/homebrew/bin:/usr/local/bin:$PATH" brew --prefix
  register: common_farm_brew_prefix
  changed_when: false
  failed_when: false
  # it reads only; brew refuses to run as root
  check_mode: false
  become: false
  when: common_farm_os == 'macos' and not common_farm_completion_dir | default('')
  tags: [devices, files]

- name: Check the folder of the bash completions
  ansible.builtin.stat:
    path: >-
      {{ common_farm_completion_dir | default('', true)
         or ('/etc/bash_completion.d' if common_farm_os == 'linux'
             else (common_farm_brew_prefix.stdout | default('', true) | trim or '/nonexistent') ~ '/etc/bash_completion.d') }}
  register: common_farm_completion
  become: false
  tags: [devices, files]

- name: Copy the bash completion of 'zebrunner-farm'
  ansible.builtin.copy:
    src: "{{ agent_dir }}/patch/completion.sh"
    dest: "{{ common_farm_completion.stat.path }}/zebrunner-farm"
    mode: "0644"
    owner: root
    group: root
  when: common_farm_os == 'linux' and common_farm_completion.stat.isdir | default(false)
  tags: [devices, files]

# the folder of Homebrew is of the user
- name: Copy the bash completion of 'zebrunner-farm' into the folder of Homebrew
  ansible.builtin.copy:
    src: "{{ agent_dir }}/patch/completion.sh"
    dest: "{{ common_farm_completion.stat.path }}/zebrunner-farm"
    mode: "0644"
  become: false
  when: common_farm_os == 'macos' and common_farm_completion.stat.isdir | default(false)
  tags: [devices, files]
