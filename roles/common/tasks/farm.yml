---
# zebrunner-farm of both OS (README.md#devices-management): the same script and its settings, the env file with the
# secrets of the host; imported by the roles of the OS (import_role tasks_from: farm) with:
#   common_farm_os: linux or macos
#   common_farm_owner and common_farm_group: the owner of the files
#   common_farm_env_mode: the mode of the settings, readable by the user of the deploy and udev (root) or launchd only

- name: Copy 'zebrunner-farm' script file
  ansible.builtin.copy:
    src: zebrunner-farm
    dest: /usr/local/bin/zebrunner-farm
    mode: "0755"
    owner: "{{ common_farm_owner }}"
    group: "{{ common_farm_group }}"
  tags: [devices, files]

- name: Create the folder of the settings of 'zebrunner-farm'
  ansible.builtin.file:
    path: /usr/local/etc
    state: directory
    mode: "0755"
  tags: [devices, files]

- name: Copy 'zebrunner-farm' settings file
  ansible.builtin.template:
    src: zebrunner-farm.env
    dest: /usr/local/etc/zebrunner-farm.env
    mode: "{{ common_farm_env_mode }}"
    owner: "{{ common_farm_owner }}"
    group: "{{ common_farm_group }}"
  tags: [devices, files]

# the devices of zebrunner-farm (and of the units of udev of Linux): readable by every user, no secret
- name: Copy devices details file
  ansible.builtin.template:
    src: mcloud-devices.txt
    dest: /usr/local/bin/mcloud-devices.txt
    mode: "0644"
    owner: root
    group: "{{ 'wheel' if common_farm_os == 'macos' else 'root' }}"
  tags: [devices, files]
