---
# The WireGuard tunnel of this host to MCloud (README.md#wireguard-tunnel): the interface mcloud-node of wg-quick with
# the settings of ./zebrunner.sh join (WG_*), up at the boot; removed when WG_ENABLED is not true, a host that never had
# it is not changed. The head of MCloud names its interface mcloud: a node on the machine of the head has both.
# The containers of the devices publish their ports on its address, which exists once the interface is up: on Linux
# docker starts after wg-quick@mcloud-node at the boot, and mcloud-wireguard-up starts the devices docker could not start
# before it (a later try of wg-quick); macOS brings it up at the boot, before the login starts Docker Desktop.
# Imported by the roles of the OS (import_role tasks_from: wireguard) with:
#   common_wg_os: linux (wireguard-tools of apt, the unit wg-quick@mcloud-node) or macos (wireguard-tools and
#   wireguard-go of Homebrew, the launch daemon com.zebrunner.wireguard)
# The config has the private key of this host: root only (600), never in a diff.

- name: Set up the WireGuard tunnel to MCloud on Linux
  when: common_wg_os == 'linux' and WG_ENABLED | default(false) | bool
  tags: [devices, wireguard]
  block:
    - name: Install wireguard-tools
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
        update_cache: true
        cache_valid_time: 86400
      register: common_wg_package

    - name: Create the folder of the WireGuard config
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Copy the WireGuard config of the tunnel to MCloud
      ansible.builtin.template:
        src: mcloud-wireguard.conf
        dest: /etc/wireguard/mcloud-node.conf
        mode: "0600"
        owner: root
        group: root
      diff: false
      register: common_wg_config

    # the name of the endpoint may not resolve yet at the boot: wg-quick tries again
    - name: Create the folder of the settings of wg-quick@mcloud-node
      ansible.builtin.file:
        path: /etc/systemd/system/wg-quick@mcloud-node.service.d
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Copy the settings of wg-quick@mcloud-node
      ansible.builtin.copy:
        content: |
          # the tunnel to MCloud (README.md#wireguard-tunnel), deployed by ./zebrunner.sh ansible: wg-quick tries again
          # when it fails, e.g. the name of the endpoint does not resolve yet at the boot
          [Service]
          Restart=on-failure
          RestartSec=10
          # docker starts after a try of wg-quick (docker.service.d/zebrunner-wireguard.conf): a try ends after this time,
          # wg-quick of the unit resolves the endpoint without an end otherwise
          TimeoutStartSec=90
          # the interface is up: the devices docker could not start without its address (the jobs of systemd, no wait)
          ExecStartPost=-/usr/bin/systemctl --no-block start mcloud-wireguard-up.service
        dest: /etc/systemd/system/wg-quick@mcloud-node.service.d/zebrunner.conf
        mode: "0644"
        owner: root
        group: root
      register: common_wg_dropin

    - name: Copy the unit of the devices once the tunnel to MCloud is up (mcloud-wireguard-up)
      ansible.builtin.template:
        src: mcloud-wireguard-up.service
        dest: /etc/systemd/system/mcloud-wireguard-up.service
        mode: "0644"
        owner: root
        group: root
      register: common_wg_up_unit

    - name: Create the folder of the settings of docker.service
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: "0755"
        owner: root
        group: root

    # at the next boot: docker is not restarted, its containers keep running
    - name: Start docker after the tunnel to MCloud at the boot
      ansible.builtin.copy:
        content: |
          # the tunnel to MCloud (README.md#wireguard-tunnel), deployed by ./zebrunner.sh ansible with WG_ENABLED: docker
          # starts after wg-quick@mcloud-node at the boot, the containers of the devices publish their ports on its address
          [Unit]
          Wants=wg-quick@mcloud-node.service
          After=wg-quick@mcloud-node.service
        dest: /etc/systemd/system/docker.service.d/zebrunner-wireguard.conf
        mode: "0644"
        owner: root
        group: root
      register: common_wg_docker_dropin

    # check mode: the unit comes with the package, which is not installed then
    - name: Enable and start the tunnel to MCloud (wg-quick@mcloud-node)
      ansible.builtin.systemd:
        name: wg-quick@mcloud-node
        enabled: true
        state: started
        daemon_reload: "{{ common_wg_dropin is changed or common_wg_up_unit is changed or common_wg_docker_dropin is changed }}"
      register: common_wg_service
      when: not (ansible_check_mode and common_wg_package is changed)

    # a new config of a tunnel that was up already: a new key or address of a new join
    - name: Restart the tunnel to MCloud with the new config
      ansible.builtin.systemd:
        name: wg-quick@mcloud-node
        state: restarted
      when: common_wg_config is changed and common_wg_service is not skipped and common_wg_service is not changed

- name: Remove the WireGuard tunnel to MCloud on Linux
  when: common_wg_os == 'linux' and not WG_ENABLED | default(false) | bool
  tags: [devices, wireguard]
  block:
    - name: Check the WireGuard config of the tunnel to MCloud
      ansible.builtin.stat:
        path: /etc/wireguard/mcloud-node.conf
      register: common_wg_config_file

    - name: Stop and disable the tunnel to MCloud (wg-quick@mcloud-node)
      ansible.builtin.systemd:
        name: wg-quick@mcloud-node
        enabled: false
        state: stopped
      when: common_wg_config_file.stat.exists

    - name: Remove the WireGuard config and the settings of wg-quick@mcloud-node
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/wireguard/mcloud-node.conf
        - /etc/systemd/system/wg-quick@mcloud-node.service.d
      when: common_wg_config_file.stat.exists

    # docker starts without waiting for the tunnel again at the next boot; nothing changes on a host without them
    - name: Remove the unit of the devices of the tunnel and the order of docker after it
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/mcloud-wireguard-up.service
        - /etc/systemd/system/docker.service.d/zebrunner-wireguard.conf
      register: common_wg_removed_units

    # at once after the removal above, as the other tasks of the tunnel reload them; the role has no handlers
    - name: Reload the units without the tunnel to MCloud  # noqa: no-handler
      ansible.builtin.systemd:
        daemon_reload: true
      when: common_wg_removed_units is changed

# macOS: wireguard-go is the interface (a utun of the kernel); /var/run/wireguard/mcloud-node.name of wg-quick names
# it
- name: Set up the WireGuard tunnel to MCloud on macOS
  when: common_wg_os == 'macos' and WG_ENABLED | default(false) | bool
  tags: [devices, wireguard]
  block:
    - name: Find the prefix of Homebrew for WireGuard
      ansible.builtin.shell: PATH="/opt/homebrew/bin:/usr/local/bin:$PATH" brew --prefix
      register: common_wg_brew_prefix
      changed_when: false
      failed_when: common_wg_brew_prefix.rc != 0
      # it reads only; brew refuses to run as root
      check_mode: false
      become: false

    - name: Check wg-quick of Homebrew
      ansible.builtin.stat:
        path: "{{ common_wg_brew_prefix.stdout | trim }}/bin/wg-quick"
      register: common_wg_quick

    # wireguard-tools brings wireguard-go and the bash 4+ of wg-quick; brew runs as the user
    - name: Install wireguard-tools and wireguard-go of Homebrew
      ansible.builtin.command:
        argv: ["{{ common_wg_brew_prefix.stdout | trim }}/bin/brew", install, wireguard-tools, wireguard-go]
      changed_when: true
      when: not common_wg_quick.stat.exists
      become: false

    - name: Create the folder of the WireGuard config
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        mode: "0700"
        owner: root
        group: wheel

    - name: Copy the WireGuard config of the tunnel to MCloud
      ansible.builtin.template:
        src: mcloud-wireguard.conf
        dest: /etc/wireguard/mcloud-node.conf
        mode: "0600"
        owner: root
        group: wheel
      diff: false
      register: common_wg_config

    - name: Copy the launch daemon of the tunnel to MCloud
      ansible.builtin.template:
        src: ZebrunnerWireguard.plist
        dest: /Library/LaunchDaemons/com.zebrunner.wireguard.plist
        mode: "0644"
        owner: root
        group: wheel
      vars:
        common_wg_bin: "{{ common_wg_brew_prefix.stdout | trim }}/bin"
      register: common_wg_daemon

    - name: Check the interface of the tunnel to MCloud
      ansible.builtin.stat:
        path: /var/run/wireguard/mcloud-node.name
      register: common_wg_up

    # the daemon runs wg-quick up once at its load and at the boot: down first, an interface of the earlier config stays
    # up otherwise
    - name: Start the tunnel to MCloud (the launch daemon com.zebrunner.wireguard)
      ansible.builtin.shell: |
        launchctl bootout system/com.zebrunner.wireguard 2> /dev/null
        if [ -e /var/run/wireguard/mcloud-node.name ]; then
          PATH="{{ common_wg_brew_prefix.stdout | trim }}/bin:$PATH" wg-quick down /etc/wireguard/mcloud-node.conf
        fi
        # launchd may still be removing the earlier daemon
        launchctl bootstrap system /Library/LaunchDaemons/com.zebrunner.wireguard.plist ||
          { sleep 2 && launchctl bootstrap system /Library/LaunchDaemons/com.zebrunner.wireguard.plist; }
      changed_when: true
      when: common_wg_config is changed or common_wg_daemon is changed or not common_wg_up.stat.exists

- name: Remove the WireGuard tunnel to MCloud on macOS
  when: common_wg_os == 'macos' and not WG_ENABLED | default(false) | bool
  tags: [devices, wireguard]
  block:
    - name: Check the launch daemon of the tunnel to MCloud
      ansible.builtin.stat:
        path: /Library/LaunchDaemons/com.zebrunner.wireguard.plist
      register: common_wg_daemon_file

    - name: Stop the tunnel to MCloud
      ansible.builtin.shell: |
        launchctl bootout system/com.zebrunner.wireguard 2> /dev/null
        if [ -e /var/run/wireguard/mcloud-node.name ]; then
          PATH="/opt/homebrew/bin:/usr/local/bin:$PATH" wg-quick down /etc/wireguard/mcloud-node.conf
        fi
        exit 0
      changed_when: true
      when: common_wg_daemon_file.stat.exists

    - name: Remove the launch daemon and the WireGuard config of the tunnel to MCloud
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /Library/LaunchDaemons/com.zebrunner.wireguard.plist
        - /etc/wireguard/mcloud-node.conf
      when: common_wg_daemon_file.stat.exists
