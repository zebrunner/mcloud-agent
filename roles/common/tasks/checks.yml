---
# The checks of the settings and the devices shared by the roles of the OS, imported by their tasks after the check of
# the OS (import_role tasks_from: checks) with:
#   common_os_role: the role of the OS (devices or mac-devices), its vars/main.yml is the settings of an earlier version
#   common_os: linux or macos, the checks of the devices of the OS (roles/common/files/devices.py)

- name: Check setup completion
  ansible.builtin.assert:
    that:
      - lookup('file', playbook_dir ~ '/config/settings.yml', errors='ignore') is not none
      - lookup('file', playbook_dir ~ '/config/devices.yml', errors='ignore') is not none
    fail_msg: "You have to set up services in advance using: ./zebrunner.sh setup!"
    success_msg: "Setup is ready: 'config/settings.yml' and 'config/devices.yml' exist."
  tags: [devices, precheck]

# the vars of a role override the settings of config/: ./zebrunner.sh migrate moves the settings of an earlier version
- name: Check the settings of an earlier version
  ansible.builtin.assert:
    that:
      - lookup('file', playbook_dir ~ '/roles/' ~ common_os_role ~ '/vars/main.yml', errors='ignore') is none
    fail_msg: >-
      roles/{{ common_os_role }}/vars/main.yml of an earlier version overrides config/: ./zebrunner.sh migrate moves its
      settings to config/settings.yml and its devices: to config/devices.yml (README.md#settings).
    success_msg: "No settings of an earlier version."
  tags: [devices, precheck]

- name: Find duplicate device IDs or names
  ansible.builtin.command:
    argv: ["{{ ansible_playbook_python }}", "{{ role_path }}/files/devices.py", dedup, "{{ common_os }}"]
    stdin: "{{ devices | to_json }}"
  register: common_dedup
  changed_when: false
  failed_when: false
  check_mode: false
  delegate_to: localhost
  become: false
  tags: [devices, precheck, dedup]

- name: Check for duplicate device IDs or names
  ansible.builtin.assert:
    that: common_dedup.rc == 0
    fail_msg: "{{ common_dedup.stdout }}{{ common_dedup.stderr }}"
    success_msg: "{{ common_dedup.stdout }}"
  tags: [devices, precheck, dedup]

# the connection to MCloud of `./zebrunner.sh join` (README.md#node-enrollment): the token of this host, the CURVE keys
# of ZeroMQ and the endpoints of MCloud
- name: Check the settings of the node enrollment
  vars:
    common_enrollment_settings:
      MCLOUD_NODE_TOKEN: "{{ MCLOUD_NODE_TOKEN | default('', true) | string | trim }}"
      STF_PROVIDER_HOST: "{{ STF_PROVIDER_HOST | default('', true) | string | trim }}"
      PUBLIC_IP: "{{ PUBLIC_IP | default('', true) | string | trim }}"
      STF_PROVIDER_CONNECT_SUB: "{{ STF_PROVIDER_CONNECT_SUB | default('', true) | string | trim }}"
      STF_PROVIDER_CONNECT_PUSH: "{{ STF_PROVIDER_CONNECT_PUSH | default('', true) | string | trim }}"
      SELENIUM_HUB_HOST: "{{ SELENIUM_HUB_HOST | default('', true) | string | trim }}"
      SELENIUM_HUB_PORT: "{{ SELENIUM_HUB_PORT | default('', true) | string | trim }}"
      STF_ZMQ_CURVE_SERVER_PUBLIC_KEY: "{{ STF_ZMQ_CURVE_SERVER_PUBLIC_KEY | default('', true) | string | trim }}"
      STF_ZMQ_CURVE_SECRET_KEY: "{{ STF_ZMQ_CURVE_SECRET_KEY | default('', true) | string | trim }}"
    common_token: "{{ common_enrollment_settings.MCLOUD_NODE_TOKEN }}"
    common_missing_settings: >-
      {{ (['MCLOUD_NODE_TOKEN'] if (common_token != '' and common_token is not match('^mcn1[.][a-z0-9][a-z0-9-]{0,39}[.][A-Za-z0-9_-]{43}$')) else [])
         + (common_enrollment_settings | dict2items | selectattr('value', 'equalto', '') | map(attribute='key') | list) }}
  ansible.builtin.assert:
    that: common_missing_settings | length == 0
    fail_msg: >-
      The settings of the node enrollment are missing or invalid in config/settings.yml: {{ common_missing_settings | join(', ') }}.
      Enroll this host with ./zebrunner.sh join and the join string of ./zebrunner.sh node-invite of mcloud
      (README.md#node-enrollment); ./zebrunner.sh doctor checks the settings.
    success_msg: "The settings of the node enrollment are set."
  tags: [devices, precheck, validate]

# the ZeroMQ security of STF: the key of this host with the key of the server (README.md#zeromq-security)
- name: Check the CURVE keys of ZeroMQ
  vars:
    curve_server_key: "{{ STF_ZMQ_CURVE_SERVER_PUBLIC_KEY | default('', true) | string }}"
    curve_secret_key: "{{ STF_ZMQ_CURVE_SECRET_KEY | default('', true) | string }}"
  ansible.builtin.assert:
    that:
      - curve_server_key is match('^[0-9a-fA-F]{64}$')
      - curve_secret_key is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      STF_ZMQ_CURVE_SERVER_PUBLIC_KEY must be the 64 hex characters of the STF server (in quotes) and
      STF_ZMQ_CURVE_SECRET_KEY the 64 hex characters of the key of this host: run ./zebrunner.sh join.
    success_msg: "The CURVE keys of ZeroMQ are valid."
  tags: [devices, precheck, validate]

# the WireGuard tunnel to MCloud of `./zebrunner.sh join` (README.md#wireguard-tunnel): the keys, the IPv4 addresses and
# the endpoint, nothing else goes into the config of wg-quick
- name: Check the settings of the WireGuard tunnel
  vars:
    common_wg_key: '^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=$'
    common_wg_ipv4: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$'
    common_wg_endpoint: "{{ WG_ENDPOINT | default('', true) | string }}"
    common_wg_invalid: >-
      {{ (['WG_PRIVATE_KEY'] if WG_PRIVATE_KEY | default('', true) | string is not match(common_wg_key) else [])
         + (['WG_SERVER_PUBLIC_KEY'] if WG_SERVER_PUBLIC_KEY | default('', true) | string is not match(common_wg_key) else [])
         + (['WG_ADDRESS'] if WG_ADDRESS | default('', true) | string is not match(common_wg_ipv4) else [])
         + (['WG_SERVER_ADDRESS'] if WG_SERVER_ADDRESS | default('', true) | string is not match(common_wg_ipv4) else [])
         + (['WG_ENDPOINT'] if common_wg_endpoint is not match('^[A-Za-z0-9][A-Za-z0-9.-]*:[0-9]{1,5}$')
            or (common_wg_endpoint | regex_replace('^.*:', '') | int) not in range(1, 65536) else [])
         + (['WG_PERSISTENT_KEEPALIVE'] if WG_PERSISTENT_KEEPALIVE | default(25, true) | string is not match('^[0-9]{1,5}$') else [])
         + (['STF_PROVIDER_HOST'] if STF_PROVIDER_HOST | default('', true) | string != WG_ADDRESS | default('', true) | string else []) }}
  ansible.builtin.assert:
    that: not WG_ENABLED | default(false) | bool or common_wg_invalid | length == 0
    fail_msg: >-
      WG_ENABLED is true, the settings of the WireGuard tunnel are missing or invalid in config/settings.yml:
      {{ common_wg_invalid | join(', ') }} (STF_PROVIDER_HOST is WG_ADDRESS). Enroll this host again with
      ./zebrunner.sh join (README.md#wireguard-tunnel).
    success_msg: >-
      {{ 'The settings of the WireGuard tunnel are valid.' if WG_ENABLED | default(false) | bool
         else 'The WireGuard tunnel to MCloud is off.' }}
  tags: [devices, precheck, validate]

# the cleanup between the uses of the devices (README.md#cleanup): empty (the default of mcloud-device), true or false
- name: Check the setting of the cleanup
  ansible.builtin.assert:
    that:
      - ('' if STF_PROVIDER_CLEANUP is none else STF_PROVIDER_CLEANUP) | string | lower in ['', 'true', 'false']
    fail_msg: >-
      STF_PROVIDER_CLEANUP of config/settings.yml is empty (the default of mcloud-device), true or false, not
      '{{ STF_PROVIDER_CLEANUP }}' (README.md#cleanup).
    success_msg: "The setting of the cleanup is valid."
  tags: [devices, precheck, validate]

# the unavailable iOS devices and the wireless watchdog (README.md#wireless-devices): the seconds
- name: Check the settings of the unavailable devices and of the wireless watchdog
  ansible.builtin.assert:
    that:
      - ('' if DEVICE_UNAVAILABLE_TIMEOUT is none else DEVICE_UNAVAILABLE_TIMEOUT) | string is match('^[0-9]*$')
      - ('' if WIRELESS_WATCHDOG_INTERVAL is none else WIRELESS_WATCHDOG_INTERVAL) | string is match('^[0-9]+$')
    fail_msg: >-
      DEVICE_UNAVAILABLE_TIMEOUT of config/settings.yml is empty (the default of the connector) or the seconds (0 or
      more), not '{{ DEVICE_UNAVAILABLE_TIMEOUT }}'; WIRELESS_WATCHDOG_INTERVAL is the seconds (0: off), not
      '{{ WIRELESS_WATCHDOG_INTERVAL }}' (README.md#wireless-devices).
    success_msg: "The settings of the unavailable devices and of the wireless watchdog are valid."
  tags: [devices, precheck, validate]

# the obligatory settings, the host ports and the connections of the devices of the OS
- name: Validate the settings of the devices
  ansible.builtin.command:
    argv: ["{{ ansible_playbook_python }}", "{{ role_path }}/files/devices.py", validate, "{{ common_os }}"]
    stdin: "{{ devices | to_json }}"
  register: common_validate
  changed_when: false
  failed_when: false
  check_mode: false
  delegate_to: localhost
  become: false
  tags: [devices, precheck, validate]

- name: Check the settings of the devices
  ansible.builtin.assert:
    that: common_validate.rc == 0
    fail_msg: "{{ common_validate.stdout }}{{ common_validate.stderr }}"
    success_msg: "{{ common_validate.stdout }}"
  tags: [devices, precheck, validate]
