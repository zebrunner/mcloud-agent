---
- name: Check OS compatibility
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == "Darwin"
    fail_msg: "OS version is not compatible! This playbook supports macOS (Darwin) only."
    success_msg: "OS is compatible: {{ ansible_facts['system'] }}"
  tags: [devices, precheck]

- name: Get current user id
  ansible.builtin.command: id -u
  register: mac_devices_user_uid
  changed_when: false
  become: false
  tags: [devices, usbmuxd, listener]

- name: Check the settings and the devices
  ansible.builtin.import_role:
    name: common
    tasks_from: checks
  vars:
    common_os_role: mac-devices
    common_os: macos

# connection: usb (default), wireless, android-sim (an Android emulator), ios-sim and proxy (iOS): the tasks of the
# USB Android devices and of the simulators run when the devices have them
- name: Collect the connection of each device
  ansible.builtin.set_fact:
    mac_devices_connections: "{{ (mac_devices_connections | default([])) + [item.connection | default('usb') | string | lower] }}"
  loop: "{{ devices }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [devices, precheck, validate, adb, simulators]

# the settings have the secrets of the host: the user (launchd runs zebrunner-farm as the user) only
- name: Deploy 'zebrunner-farm'
  ansible.builtin.import_role:
    name: common
    tasks_from: farm
  vars:
    common_farm_os: macos
    common_farm_owner: "{{ lookup('env', 'USER') }}"
    common_farm_group: wheel
    common_farm_env_mode: "0600"

- name: Copy 'zebrunner-device-listener' script file
  ansible.builtin.template:
    src: zebrunner-device-listener
    dest: /usr/local/bin/zebrunner-device-listener
    mode: "0755"
    owner: root
    group: wheel
  tags: [devices, files]

- name: Copy 'usbmuxd_watch' binary file
  ansible.builtin.copy:
    src: usbmuxd_watch
    dest: /usr/local/bin/usbmuxd_watch
    mode: "0755"
    owner: root
    group: wheel
  tags: [devices, files]

- name: Copy devices details file
  ansible.builtin.template:
    src: mcloud-devices.txt
    dest: /usr/local/bin/mcloud-devices.txt
    mode: "0644"
    owner: root
    group: wheel
  tags: [devices, files]

- name: Copy devices listener log rotation settings
  ansible.builtin.template:
    src: zebrunner-mcloud.newsyslog.conf
    dest: /etc/newsyslog.d/zebrunner-mcloud.conf
    mode: "0644"
    owner: root
    group: wheel
  tags: [devices, files]

- name: Check if ZebrunnerDevicesListener agent is loaded
  ansible.builtin.command: launchctl list com.zebrunner.mcloud
  register: mac_devices_mcloud_agent_loaded
  failed_when: false
  changed_when: false
  become: false
  tags: [devices, precheck, listener]

- name: Unload ZebrunnerDevicesListener agent if loaded
  ansible.builtin.command:
    argv:
      - launchctl
      - bootout
      - "gui/{{ mac_devices_user_uid.stdout }}"
      - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerDevicesListener.plist"
  when: mac_devices_mcloud_agent_loaded.rc == 0
  changed_when: false
  become: false
  tags: [devices, listener]

- name: Check if ZebrunnerUsbmuxd agent is loaded
  ansible.builtin.command: launchctl list com.zebrunner.usbmuxd
  register: mac_devices_usbmuxd_agent_loaded
  failed_when: false
  changed_when: false
  become: false
  tags: [devices, precheck, usbmuxd]

- name: Unload ZebrunnerUsbmuxd agent if loaded
  ansible.builtin.command:
    argv:
      - launchctl
      - bootout
      - "gui/{{ mac_devices_user_uid.stdout }}"
      - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerUsbmuxd.plist"
  when: mac_devices_usbmuxd_agent_loaded.rc == 0
  changed_when: false
  become: false
  tags: [devices, usbmuxd]

- name: Copy ZebrunnerDevicesListener.plist into LaunchAgents
  ansible.builtin.template:
    src: roles/mac-devices/templates/ZebrunnerDevicesListener.plist
    dest: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerDevicesListener.plist"
    mode: "0644"
    owner: "{{ lookup('env', 'USER') }}"
    group: staff
  tags: [devices, listener]

- name: Copy ZebrunnerUsbmuxd.plist into LaunchAgents
  ansible.builtin.template:
    src: roles/mac-devices/templates/ZebrunnerUsbmuxd.plist
    dest: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerUsbmuxd.plist"
    mode: "0644"
    owner: "{{ lookup('env', 'USER') }}"
    group: staff
  tags: [devices, usbmuxd]

- name: Load ZebrunnerDevicesListener agent if it was loaded earlier
  ansible.builtin.command:
    argv:
      - launchctl
      - bootstrap
      - "gui/{{ mac_devices_user_uid.stdout }}"
      - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerDevicesListener.plist"
  when: mac_devices_mcloud_agent_loaded.rc == 0
  changed_when: false
  become: false
  tags: [devices, listener]

- name: Enable ZebrunnerDevicesListener agent via launchctl if it was loaded earlier
  ansible.builtin.command: launchctl enable gui/{{ mac_devices_user_uid.stdout }}/com.zebrunner.mcloud
  when: mac_devices_mcloud_agent_loaded.rc == 0
  changed_when: false
  become: false
  tags: [devices, listener]

- name: Load ZebrunnerUsbmuxd agent via launchctl
  ansible.builtin.command:
    argv:
      - launchctl
      - bootstrap
      - "gui/{{ mac_devices_user_uid.stdout }}"
      - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerUsbmuxd.plist"
  changed_when: false
  become: false
  tags: [devices, usbmuxd]

- name: Enable ZebrunnerUsbmuxd agent via launchctl
  ansible.builtin.command: launchctl enable gui/{{ mac_devices_user_uid.stdout }}/com.zebrunner.usbmuxd
  changed_when: false
  become: false
  tags: [devices, usbmuxd]

# The USB Android devices stay on the adb server of the host (Docker of macOS has no USB), their connectors take them
# from it. Only the adb server runs on the host, every device command comes from the containers.
- name: USB Android devices
  when: mac_devices_connections | zip(devices | map(attribute='os')) | map('join', ':') | select('equalto', 'usb:android') | list | length > 0
  tags: [devices, adb]
  block:
    - name: Find adb of the host
      ansible.builtin.shell: PATH="/opt/homebrew/bin:/usr/local/bin:$PATH" command -v adb
      register: mac_devices_adb
      changed_when: false
      failed_when: false
      become: false

    - name: Check adb of the host
      ansible.builtin.assert:
        that: mac_devices_adb.rc == 0
        fail_msg: "adb is required for the USB Android devices: brew install android-platform-tools"
        success_msg: "adb of the host: {{ mac_devices_adb.stdout }}"

    - name: Check if ZebrunnerAdb agent is loaded
      ansible.builtin.command: launchctl list com.zebrunner.adb
      register: mac_devices_adb_agent_loaded
      failed_when: false
      changed_when: false
      become: false

    - name: Unload ZebrunnerAdb agent if loaded
      ansible.builtin.command:
        argv:
          - launchctl
          - bootout
          - "gui/{{ mac_devices_user_uid.stdout }}"
          - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerAdb.plist"
      when: mac_devices_adb_agent_loaded.rc == 0
      changed_when: false
      become: false

    - name: Copy ZebrunnerAdb.plist into LaunchAgents
      ansible.builtin.template:
        src: roles/mac-devices/templates/ZebrunnerAdb.plist
        dest: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerAdb.plist"
        mode: "0644"
        owner: "{{ lookup('env', 'USER') }}"
        group: staff
      vars:
        mac_devices_adb_path: "{{ mac_devices_adb.stdout }}"

    - name: Load ZebrunnerAdb agent via launchctl
      ansible.builtin.command:
        argv:
          - launchctl
          - bootstrap
          - "gui/{{ mac_devices_user_uid.stdout }}"
          - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerAdb.plist"
      changed_when: false
      become: false

# The iOS simulators run on the host: their connector and Appium containers run xcrun of the host over ssh with a key of
# the agent, Remote Login (System Settings, General, Sharing) must be on for the user.
- name: Simulators
  when: "'ios-sim' in mac_devices_connections"
  tags: [devices, simulators]
  block:
    - name: Create the ssh folder of the agent
      ansible.builtin.file:
        path: "{{ agent_dir }}/ssh"
        state: directory
        mode: "0700"
        owner: "{{ lookup('env', 'USER') }}"
      become: false

    - name: Generate the ssh key of the simulators
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - zebrunner-mcloud-simulators
          - -f
          - "{{ agent_dir }}/ssh/id_ed25519"
        creates: "{{ agent_dir }}/ssh/id_ed25519"
      become: false

    - name: Read the public ssh key of the simulators
      ansible.builtin.slurp:
        src: "{{ agent_dir }}/ssh/id_ed25519.pub"
      register: mac_devices_ssh_public_key
      become: false

    # restrict: no forwarding and no pty, the containers only run commands of the host
    - name: Authorize the ssh key of the simulators
      ansible.builtin.lineinfile:
        path: "{{ lookup('env', 'HOME') }}/.ssh/authorized_keys"
        line: "restrict {{ mac_devices_ssh_public_key.content | b64decode | trim }}"
        regexp: "zebrunner-mcloud-simulators$"
        create: true
        mode: "0600"
        owner: "{{ lookup('env', 'USER') }}"
      become: false

    - name: Check Remote Login of the host
      ansible.builtin.command: nc -z -G 3 127.0.0.1 22
      register: mac_devices_remote_login
      failed_when: false
      changed_when: false
      become: false

    # a missing Remote Login is reported but does not stop the deploy: it can be turned on later
    - name: Report Remote Login of the host  # noqa: ignore-errors
      ansible.builtin.assert:
        that: mac_devices_remote_login.rc == 0
        fail_msg: "Remote Login is off: turn it on in System Settings, General, Sharing for the iOS simulators."
        success_msg: "Remote Login is on."
      ignore_errors: true
