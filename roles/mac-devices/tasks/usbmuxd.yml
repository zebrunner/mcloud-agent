---
- name: Check OS compatibility
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == "Darwin"
    fail_msg: "OS version is not compatible! This playbook supports macOS (Darwin) only."
    success_msg: "OS is compatible: {{ ansible_facts['system'] }}"
  tags: [devices, precheck]

- name: Get current user id
  ansible.builtin.command: id -u
  register: mac_devices_user_uid
  changed_when: false
  become: false
  tags: [devices, usbmuxd, listener]

- name: Check setup completion
  ansible.builtin.assert:
    that:
      - lookup('file', 'roles/mac-devices/vars/main.yml', errors='ignore') is not none
    fail_msg: "You have to set up services in advance using: ./zebrunner.sh setup!"
    success_msg: "Setup is ready: 'roles/mac-devices/vars/main.yml' exists."
  tags: [devices, precheck]

- name: Check 'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable
  ansible.builtin.assert:
    that:
      - lookup('env', 'ZEBRUNNER_MCLOUD_AGENT_DIR') | length > 0
    fail_msg: "You have to set up 'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable in advance!"
    success_msg: "'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable is defined."
  tags: [devices, precheck]

- name: Collect all device IDs and names
  ansible.builtin.set_fact:
    mac_devices_all_ids: "{{ devices | map(attribute='id') | map('trim') | list }}"
    mac_devices_all_names: "{{ devices | map(attribute='name') | map('trim') | map('regex_replace', '\\s+', '_') | list }}"
  tags: [devices, precheck, dedup]

- name: Count occurrences of each device id
  ansible.builtin.set_fact:
    mac_devices_id_counts: "{{ mac_devices_id_counts | default({}) | combine({item: (mac_devices_id_counts | default({}))[item] | default(0) + 1}) }}"
  loop: "{{ mac_devices_all_ids }}"
  tags: [devices, precheck, dedup]

- name: Count occurrences of each device name
  ansible.builtin.set_fact:
    mac_devices_name_counts: "{{ mac_devices_name_counts | default({}) | combine({item: (mac_devices_name_counts | default({}))[item] | default(0) + 1}) }}"
  loop: "{{ mac_devices_all_names }}"
  tags: [devices, precheck, dedup]

- name: Determine duplicate ids
  ansible.builtin.set_fact:
    mac_devices_dup_ids: "{{ mac_devices_id_counts | dict2items | selectattr('value', '>', 1) | map(attribute='key') | list }}"
  tags: [devices, precheck, dedup]

- name: Determine duplicate names
  ansible.builtin.set_fact:
    mac_devices_dup_names: "{{ mac_devices_name_counts | dict2items | selectattr('value', '>', 1) | map(attribute='key') | list }}"
  tags: [devices, precheck, dedup]

- name: Check for duplicate device IDs or names
  ansible.builtin.assert:
    that:
      - mac_devices_dup_ids | length == 0
      - mac_devices_dup_names | length == 0
    fail_msg: "Duplicate devices found! Duplicate IDs: {{ mac_devices_dup_ids }} Duplicate Names: {{ mac_devices_dup_names }}"
    success_msg: "All device IDs and names are unique."
  tags: [devices, precheck, dedup]

# the authentication of the MCloud server: its tokens and the CURVE keys of ZeroMQ (README.md#connect-to-mcloud)
- name: Check the obligatory settings of the MCloud server
  vars:
    mac_devices_server_settings:
      STF_STORAGE_TOKEN: "{{ STF_STORAGE_TOKEN | default('', true) | string | trim }}"
      NODE_REGISTRATION_TOKEN: "{{ NODE_REGISTRATION_TOKEN | default('', true) | string | trim }}"
      STF_ZMQ_CURVE_SERVER_PUBLIC_KEY: "{{ STF_ZMQ_CURVE_SERVER_PUBLIC_KEY | default('', true) | string | trim }}"
      STF_ZMQ_CURVE_SECRET_KEY: "{{ STF_ZMQ_CURVE_SECRET_KEY | default('', true) | string | trim }}"
    mac_devices_missing_settings: "{{ mac_devices_server_settings | dict2items | selectattr('value', 'equalto', '') | map(attribute='key') | list }}"
  ansible.builtin.assert:
    that: mac_devices_missing_settings | length == 0
    fail_msg: >-
      The obligatory settings of the MCloud server are missing: {{ mac_devices_missing_settings | join(', ') }}.
      Set them in roles/mac-devices/vars/main.yml, in quotes: STF_STORAGE_TOKEN, NODE_REGISTRATION_TOKEN and
      STF_ZMQ_CURVE_SERVER_PUBLIC_KEY are the ones of variables.env of mcloud; STF_ZMQ_CURVE_SECRET_KEY is the key of
      this host: run ./zebrunner.sh curve-key and add its public key to STF_ZMQ_CURVE_CLIENT_KEYS of variables.env of
      mcloud (README.md#connect-to-mcloud).
    success_msg: "The obligatory settings of the MCloud server are set."
  tags: [devices, precheck, validate]

# the ZeroMQ security of STF: the key of this host with the key of the server (README.md#zeromq-security)
- name: Check the CURVE keys of ZeroMQ
  vars:
    curve_server_key: "{{ STF_ZMQ_CURVE_SERVER_PUBLIC_KEY | default('', true) | string }}"
    curve_secret_key: "{{ STF_ZMQ_CURVE_SECRET_KEY | default('', true) | string }}"
  ansible.builtin.assert:
    that:
      - curve_server_key is match('^[0-9a-fA-F]{64}$')
      - curve_secret_key is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      STF_ZMQ_CURVE_SERVER_PUBLIC_KEY must be the 64 hex characters of the STF server (in quotes) and
      STF_ZMQ_CURVE_SECRET_KEY the 64 hex characters of the key of this host: run ./zebrunner.sh curve-key.
    success_msg: "The CURVE keys of ZeroMQ are valid."
  tags: [devices, precheck, validate]

- name: Check obligatory settings of each device
  ansible.builtin.assert:
    that:
      - item.id is defined and item.name is defined
      - item.os is defined and item.os in ['android', 'ios']
      - item.appium_port is defined and item.adb_port is defined and item.min_port is defined and item.max_port is defined
      - 0 < (item.appium_port | int) < 65536
      - 0 < (item.min_port | int) <= (item.max_port | int) < 65536
    fail_msg: >-
      Invalid settings of device '{{ item.name | default(item.id) | default('?') }}':
      id, name, os (android or ios), appium_port, adb_port, min_port and max_port are obligatory,
      ports are 1-65535 and min_port is not greater than max_port.
    success_msg: "Device '{{ item.name | default(item.id) | default('?') }}' settings are valid."
    quiet: true
  loop: "{{ devices }}"
  loop_control:
    label: "{{ item.name | default(item.id) | default('?') }}"
  tags: [devices, precheck, validate]

# appium_port and the min_port-max_port range are published on the host, other ports stay in the containers
- name: Collect host ports published by each device
  ansible.builtin.set_fact:
    mac_devices_ports: "{{ (mac_devices_ports | default([])) + [[item.appium_port | int] + range(item.min_port | int, (item.max_port | int) + 1) | list] }}"
  loop: "{{ devices }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [devices, precheck, validate]

- name: Check that devices do not share host ports
  vars:
    other_ports: "{{ (mac_devices_ports[:idx] + mac_devices_ports[idx + 1 :]) | flatten }}"
    own_range: "{{ range(item.min_port | int, (item.max_port | int) + 1) | list }}"
    shared_ports: "{{ mac_devices_ports[idx] | intersect(other_ports) | union([item.appium_port | int] | intersect(own_range)) }}"
  ansible.builtin.assert:
    that: shared_ports | length == 0
    fail_msg: >-
      Host ports {{ shared_ports }} of device '{{ item.name }}' are used by another device
      or by both its appium_port and min_port-max_port range.
    success_msg: "Host ports of device '{{ item.name }}' are not shared."
    quiet: true
  loop: "{{ devices }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"
  tags: [devices, precheck, validate]

# connection: usb (default), wireless, android-sim (an Android emulator), ios-sim and proxy (iOS)
- name: Collect the connection of each device
  ansible.builtin.set_fact:
    mac_devices_connections: "{{ (mac_devices_connections | default([])) + [item.connection | default('usb') | string | lower] }}"
  loop: "{{ devices }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [devices, precheck, validate, adb, simulators]

- name: Check the connection of each device
  vars:
    mac_devices_connection: "{{ mac_devices_connections[idx] }}"
  ansible.builtin.assert:
    that:
      - mac_devices_connection in ['usb', 'wireless', 'android-sim', 'ios-sim', 'proxy']
      - mac_devices_connection != 'android-sim' or item.os == 'android'
      - mac_devices_connection not in ['ios-sim', 'proxy'] or item.os == 'ios'
      - mac_devices_connection != 'ios-sim' or (item.wda_port | default('') | string | length) > 0
      - mac_devices_connection != 'proxy' or (item.address | default('') | string | length) > 0
    fail_msg: >-
      Invalid connection '{{ mac_devices_connection }}' of device '{{ item.name }}': usb, wireless, android-sim (an
      Android emulator started outside the farm, address is its adb address), ios-sim (an iOS simulator of the host,
      needs wda_port: the unique port of its WebDriverAgent on the host) or proxy (iOS, needs address where its
      WebDriverAgent is published).
    success_msg: "Device '{{ item.name }}' connection '{{ mac_devices_connection }}' is valid."
    quiet: true
  loop: "{{ devices }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"
  tags: [devices, precheck, validate]

# the WebDriverAgent ports of the iOS simulators and the adb forwards of the USB Android devices are on the host too
- name: Collect host ports used by the iOS simulators and the USB Android devices
  vars:
    mac_devices_connection: "{{ mac_devices_connections[idx] }}"
    mac_devices_wda_port: "{{ item.wda_port | default(0) | int }}"
  ansible.builtin.set_fact:
    mac_devices_host_ports: >-
      {{ (mac_devices_host_ports | default([])) + (
           [mac_devices_wda_port | int, (item.mjpeg_port | default((mac_devices_wda_port | int) + 1)) | int]
           if mac_devices_connection == 'ios-sim'
           else ([item.adb_port | int] if (mac_devices_connection == 'usb' and item.os == 'android') else [])) }}
  loop: "{{ devices }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"
  tags: [devices, precheck, validate]

- name: Check that the host ports of the iOS simulators and the USB Android devices are unique
  ansible.builtin.assert:
    that:
      - mac_devices_host_ports | length == mac_devices_host_ports | unique | length
      - mac_devices_host_ports | intersect(mac_devices_ports | flatten) | length == 0
    fail_msg: >-
      The host ports {{ mac_devices_host_ports }} of the iOS simulators (wda_port, mjpeg_port) and of the USB Android
      devices (adb_port) must be unique and not used by appium_port or min_port-max_port of the devices.
    success_msg: "The host ports of the iOS simulators and the USB Android devices are unique."
  tags: [devices, precheck, validate]

- name: Copy 'zebrunner-farm' script file
  ansible.builtin.template:
    src: zebrunner-farm
    dest: /usr/local/bin/zebrunner-farm
    mode: "0755"
    owner: root
    group: wheel
  tags: [devices, files]

- name: Copy 'zebrunner-device-listener' script file
  ansible.builtin.template:
    src: zebrunner-device-listener
    dest: /usr/local/bin/zebrunner-device-listener
    mode: "0755"
    owner: root
    group: wheel
  tags: [devices, files]

- name: Copy 'usbmuxd_watch' binary file
  ansible.builtin.copy:
    src: usbmuxd_watch
    dest: /usr/local/bin/usbmuxd_watch
    mode: "0755"
    owner: root
    group: wheel
  tags: [devices, files]

- name: Copy devices details file
  ansible.builtin.template:
    src: mcloud-devices.txt
    dest: /usr/local/bin/mcloud-devices.txt
    mode: "0644"
    owner: root
    group: wheel
  tags: [devices, files]

- name: Copy devices listener log rotation settings
  ansible.builtin.template:
    src: zebrunner-mcloud.newsyslog.conf
    dest: /etc/newsyslog.d/zebrunner-mcloud.conf
    mode: "0644"
    owner: root
    group: wheel
  tags: [devices, files]

- name: Check if ZebrunnerDevicesListener agent is loaded
  ansible.builtin.command: launchctl list com.zebrunner.mcloud
  register: mac_devices_mcloud_agent_loaded
  failed_when: false
  changed_when: false
  become: false
  tags: [devices, precheck, listener]

- name: Unload ZebrunnerDevicesListener agent if loaded
  ansible.builtin.command:
    argv:
      - launchctl
      - bootout
      - "gui/{{ mac_devices_user_uid.stdout }}"
      - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerDevicesListener.plist"
  when: mac_devices_mcloud_agent_loaded.rc == 0
  changed_when: false
  become: false
  tags: [devices, listener]

- name: Check if ZebrunnerUsbmuxd agent is loaded
  ansible.builtin.command: launchctl list com.zebrunner.usbmuxd
  register: mac_devices_usbmuxd_agent_loaded
  failed_when: false
  changed_when: false
  become: false
  tags: [devices, precheck, usbmuxd]

- name: Unload ZebrunnerUsbmuxd agent if loaded
  ansible.builtin.command:
    argv:
      - launchctl
      - bootout
      - "gui/{{ mac_devices_user_uid.stdout }}"
      - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerUsbmuxd.plist"
  when: mac_devices_usbmuxd_agent_loaded.rc == 0
  changed_when: false
  become: false
  tags: [devices, usbmuxd]

- name: Copy ZebrunnerDevicesListener.plist into LaunchAgents
  ansible.builtin.template:
    src: roles/mac-devices/templates/ZebrunnerDevicesListener.plist
    dest: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerDevicesListener.plist"
    mode: "0644"
    owner: "{{ lookup('env', 'USER') }}"
    group: staff
  tags: [devices, listener]

- name: Copy ZebrunnerUsbmuxd.plist into LaunchAgents
  ansible.builtin.template:
    src: roles/mac-devices/templates/ZebrunnerUsbmuxd.plist
    dest: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerUsbmuxd.plist"
    mode: "0644"
    owner: "{{ lookup('env', 'USER') }}"
    group: staff
  tags: [devices, usbmuxd]

- name: Load ZebrunnerDevicesListener agent if it was loaded earlier
  ansible.builtin.command:
    argv:
      - launchctl
      - bootstrap
      - "gui/{{ mac_devices_user_uid.stdout }}"
      - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerDevicesListener.plist"
  when: mac_devices_mcloud_agent_loaded.rc == 0
  changed_when: false
  become: false
  tags: [devices, listener]

- name: Enable ZebrunnerDevicesListener agent via launchctl if it was loaded earlier
  ansible.builtin.command: launchctl enable gui/{{ mac_devices_user_uid.stdout }}/com.zebrunner.mcloud
  when: mac_devices_mcloud_agent_loaded.rc == 0
  changed_when: false
  become: false
  tags: [devices, listener]

- name: Load ZebrunnerUsbmuxd agent via launchctl
  ansible.builtin.command:
    argv:
      - launchctl
      - bootstrap
      - "gui/{{ mac_devices_user_uid.stdout }}"
      - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerUsbmuxd.plist"
  changed_when: false
  become: false
  tags: [devices, usbmuxd]

- name: Enable ZebrunnerUsbmuxd agent via launchctl
  ansible.builtin.command: launchctl enable gui/{{ mac_devices_user_uid.stdout }}/com.zebrunner.usbmuxd
  changed_when: false
  become: false
  tags: [devices, usbmuxd]

# The USB Android devices stay on the adb server of the host (Docker of macOS has no USB), their connectors take them
# from it. Only the adb server runs on the host, every device command comes from the containers.
- name: USB Android devices
  when: mac_devices_connections | zip(devices | map(attribute='os')) | map('join', ':') | select('equalto', 'usb:android') | list | length > 0
  tags: [devices, adb]
  block:
    - name: Find adb of the host
      ansible.builtin.shell: PATH="/opt/homebrew/bin:/usr/local/bin:$PATH" command -v adb
      register: mac_devices_adb
      changed_when: false
      failed_when: false
      become: false

    - name: Check adb of the host
      ansible.builtin.assert:
        that: mac_devices_adb.rc == 0
        fail_msg: "adb is required for the USB Android devices: brew install android-platform-tools"
        success_msg: "adb of the host: {{ mac_devices_adb.stdout }}"

    - name: Check if ZebrunnerAdb agent is loaded
      ansible.builtin.command: launchctl list com.zebrunner.adb
      register: mac_devices_adb_agent_loaded
      failed_when: false
      changed_when: false
      become: false

    - name: Unload ZebrunnerAdb agent if loaded
      ansible.builtin.command:
        argv:
          - launchctl
          - bootout
          - "gui/{{ mac_devices_user_uid.stdout }}"
          - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerAdb.plist"
      when: mac_devices_adb_agent_loaded.rc == 0
      changed_when: false
      become: false

    - name: Copy ZebrunnerAdb.plist into LaunchAgents
      ansible.builtin.template:
        src: roles/mac-devices/templates/ZebrunnerAdb.plist
        dest: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerAdb.plist"
        mode: "0644"
        owner: "{{ lookup('env', 'USER') }}"
        group: staff
      vars:
        mac_devices_adb_path: "{{ mac_devices_adb.stdout }}"

    - name: Load ZebrunnerAdb agent via launchctl
      ansible.builtin.command:
        argv:
          - launchctl
          - bootstrap
          - "gui/{{ mac_devices_user_uid.stdout }}"
          - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerAdb.plist"
      changed_when: false
      become: false

# The iOS simulators run on the host: their connector and Appium containers run xcrun of the host over ssh with a key of
# the agent, Remote Login (System Settings, General, Sharing) must be on for the user.
- name: Simulators
  when: "'ios-sim' in mac_devices_connections"
  tags: [devices, simulators]
  block:
    - name: Create the ssh folder of the agent
      ansible.builtin.file:
        path: "{{ lookup('env', 'ZEBRUNNER_MCLOUD_AGENT_DIR') }}/ssh"
        state: directory
        mode: "0700"
        owner: "{{ lookup('env', 'USER') }}"
      become: false

    - name: Generate the ssh key of the simulators
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - zebrunner-mcloud-simulators
          - -f
          - "{{ lookup('env', 'ZEBRUNNER_MCLOUD_AGENT_DIR') }}/ssh/id_ed25519"
        creates: "{{ lookup('env', 'ZEBRUNNER_MCLOUD_AGENT_DIR') }}/ssh/id_ed25519"
      become: false

    - name: Read the public ssh key of the simulators
      ansible.builtin.slurp:
        src: "{{ lookup('env', 'ZEBRUNNER_MCLOUD_AGENT_DIR') }}/ssh/id_ed25519.pub"
      register: mac_devices_ssh_public_key
      become: false

    # restrict: no forwarding and no pty, the containers only run commands of the host
    - name: Authorize the ssh key of the simulators
      ansible.builtin.lineinfile:
        path: "{{ lookup('env', 'HOME') }}/.ssh/authorized_keys"
        line: "restrict {{ mac_devices_ssh_public_key.content | b64decode | trim }}"
        regexp: "zebrunner-mcloud-simulators$"
        create: true
        mode: "0600"
        owner: "{{ lookup('env', 'USER') }}"
      become: false

    - name: Check Remote Login of the host
      ansible.builtin.command: nc -z -G 3 127.0.0.1 22
      register: mac_devices_remote_login
      failed_when: false
      changed_when: false
      become: false

    # a missing Remote Login is reported but does not stop the deploy: it can be turned on later
    - name: Report Remote Login of the host  # noqa: ignore-errors
      ansible.builtin.assert:
        that: mac_devices_remote_login.rc == 0
        fail_msg: "Remote Login is off: turn it on in System Settings, General, Sharing for the iOS simulators."
        success_msg: "Remote Login is on."
      ignore_errors: true
