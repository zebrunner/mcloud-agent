---
- name: Check OS compatibility
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == "Darwin"
    fail_msg: "OS version is not compatible! This playbook supports macOS (Darwin) only."
    success_msg: "OS is compatible: {{ ansible_facts['system'] }}"
  tags: [devices, precheck]

- name: Get current user id
  ansible.builtin.command: id -u
  register: mac_devices_user_uid
  changed_when: false
  become: false
  tags: [devices, usbmuxd, listener, watchdog]

- name: Check the settings and the devices
  ansible.builtin.import_role:
    name: common
    tasks_from: checks
  vars:
    common_os_role: mac-devices
    common_os: macos

# the launch agents of usbmuxd (socat) and of the adb server listen on the ports of these addresses
- name: Check the addresses of usbmuxd and of the adb server of the host
  ansible.builtin.assert:
    that:
      - USBMUXD_SOCKET_ADDRESS | string is regex('^[^:\s]+:[0-9]{1,5}$')
      - ADB_SERVER_SOCKET_ADDRESS | string is regex('^[^:\s]+:[0-9]{1,5}$')
      - USBMUXD_SOCKET_ADDRESS | regex_replace('^.*:', '') | int in range(1, 65536)
      - ADB_SERVER_SOCKET_ADDRESS | regex_replace('^.*:', '') | int in range(1, 65536)
    fail_msg: "USBMUXD_SOCKET_ADDRESS and ADB_SERVER_SOCKET_ADDRESS are <host>:<port> (1-65535) of the host for the containers"
    quiet: true
  tags: [devices, precheck, validate]

# connection: usb (default), wireless, android-sim (an Android emulator), ios-sim and proxy (iOS): the tasks of the
# USB Android devices and of the simulators run when the devices have them
- name: Collect the connection of each device
  ansible.builtin.set_fact:
    mac_devices_connections: "{{ (mac_devices_connections | default([])) + [item.connection | default('usb') | string | lower] }}"
  loop: "{{ devices }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [devices, precheck, validate, adb, simulators]

# the settings have the secrets of the host: the user (launchd runs zebrunner-farm as the user) only
- name: Deploy 'zebrunner-farm'
  ansible.builtin.import_role:
    name: common
    tasks_from: farm
  vars:
    common_farm_os: macos
    common_farm_owner: "{{ lookup('env', 'USER') }}"
    common_farm_group: wheel
    common_farm_env_mode: "0600"

# the tunnel to MCloud of WG_ENABLED (README.md#wireguard-tunnel): the launch daemon com.zebrunner.wireguard, removed
# without it
- name: Deploy the WireGuard tunnel to MCloud
  ansible.builtin.import_role:
    name: common
    tasks_from: wireguard
  vars:
    common_wg_os: macos

- name: Copy 'zebrunner-device-listener' script file
  ansible.builtin.template:
    src: zebrunner-device-listener
    dest: /usr/local/bin/zebrunner-device-listener
    mode: "0755"
    owner: root
    group: wheel
  tags: [devices, files]

- name: Copy 'usbmuxd_watch' binary file
  ansible.builtin.copy:
    src: usbmuxd_watch
    dest: /usr/local/bin/usbmuxd_watch
    mode: "0755"
    owner: root
    group: wheel
  tags: [devices, files]

- name: Copy devices listener log rotation settings
  ansible.builtin.template:
    src: zebrunner-mcloud.newsyslog.conf
    dest: /etc/newsyslog.d/zebrunner-mcloud.conf
    mode: "0644"
    owner: root
    group: wheel
  tags: [devices, files]

- name: Check if ZebrunnerDevicesListener agent is loaded
  ansible.builtin.command: launchctl list com.zebrunner.mcloud
  register: mac_devices_mcloud_agent_loaded
  failed_when: false
  changed_when: false
  become: false
  tags: [devices, precheck, listener]

- name: Unload ZebrunnerDevicesListener agent if loaded
  ansible.builtin.command:
    argv:
      - launchctl
      - bootout
      - "gui/{{ mac_devices_user_uid.stdout }}"
      - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerDevicesListener.plist"
  when: mac_devices_mcloud_agent_loaded.rc == 0
  changed_when: false
  become: false
  tags: [devices, listener]

- name: Check if ZebrunnerUsbmuxd agent is loaded
  ansible.builtin.command: launchctl list com.zebrunner.usbmuxd
  register: mac_devices_usbmuxd_agent_loaded
  failed_when: false
  changed_when: false
  become: false
  tags: [devices, precheck, usbmuxd]

- name: Unload ZebrunnerUsbmuxd agent if loaded
  ansible.builtin.command:
    argv:
      - launchctl
      - bootout
      - "gui/{{ mac_devices_user_uid.stdout }}"
      - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerUsbmuxd.plist"
  when: mac_devices_usbmuxd_agent_loaded.rc == 0
  changed_when: false
  become: false
  tags: [devices, usbmuxd]

- name: Copy ZebrunnerDevicesListener.plist into LaunchAgents
  ansible.builtin.template:
    src: roles/mac-devices/templates/ZebrunnerDevicesListener.plist
    dest: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerDevicesListener.plist"
    mode: "0644"
    owner: "{{ lookup('env', 'USER') }}"
    group: staff
  tags: [devices, listener]

- name: Copy ZebrunnerUsbmuxd.plist into LaunchAgents
  ansible.builtin.template:
    src: roles/mac-devices/templates/ZebrunnerUsbmuxd.plist
    dest: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerUsbmuxd.plist"
    mode: "0644"
    owner: "{{ lookup('env', 'USER') }}"
    group: staff
  tags: [devices, usbmuxd]

- name: Load ZebrunnerDevicesListener agent if it was loaded earlier
  ansible.builtin.command:
    argv:
      - launchctl
      - bootstrap
      - "gui/{{ mac_devices_user_uid.stdout }}"
      - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerDevicesListener.plist"
  when: mac_devices_mcloud_agent_loaded.rc == 0
  changed_when: false
  become: false
  tags: [devices, listener]

- name: Enable ZebrunnerDevicesListener agent via launchctl if it was loaded earlier
  ansible.builtin.command: launchctl enable gui/{{ mac_devices_user_uid.stdout }}/com.zebrunner.mcloud
  when: mac_devices_mcloud_agent_loaded.rc == 0
  changed_when: false
  become: false
  tags: [devices, listener]

- name: Load ZebrunnerUsbmuxd agent via launchctl
  ansible.builtin.command:
    argv:
      - launchctl
      - bootstrap
      - "gui/{{ mac_devices_user_uid.stdout }}"
      - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerUsbmuxd.plist"
  changed_when: false
  become: false
  tags: [devices, usbmuxd]

- name: Enable ZebrunnerUsbmuxd agent via launchctl
  ansible.builtin.command: launchctl enable gui/{{ mac_devices_user_uid.stdout }}/com.zebrunner.usbmuxd
  changed_when: false
  become: false
  tags: [devices, usbmuxd]

# The USB Android devices stay on the adb server of the host (Docker of macOS has no USB), their connectors take them
# from it. Only the adb server runs on the host, every device command comes from the containers.
- name: USB Android devices
  when: mac_devices_connections | zip(devices | map(attribute='os')) | map('join', ':') | select('equalto', 'usb:android') | list | length > 0
  tags: [devices, adb]
  block:
    - name: Find adb of the host
      ansible.builtin.shell: PATH="/opt/homebrew/bin:/usr/local/bin:$PATH" command -v adb
      register: mac_devices_adb
      changed_when: false
      failed_when: false
      become: false

    - name: Check adb of the host
      ansible.builtin.assert:
        that: mac_devices_adb.rc == 0
        fail_msg: "adb is required for the USB Android devices: brew install android-platform-tools"
        success_msg: "adb of the host: {{ mac_devices_adb.stdout }}"

    - name: Check if ZebrunnerAdb agent is loaded
      ansible.builtin.command: launchctl list com.zebrunner.adb
      register: mac_devices_adb_agent_loaded
      failed_when: false
      changed_when: false
      become: false

    - name: Unload ZebrunnerAdb agent if loaded
      ansible.builtin.command:
        argv:
          - launchctl
          - bootout
          - "gui/{{ mac_devices_user_uid.stdout }}"
          - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerAdb.plist"
      when: mac_devices_adb_agent_loaded.rc == 0
      changed_when: false
      become: false

    - name: Copy ZebrunnerAdb.plist into LaunchAgents
      ansible.builtin.template:
        src: roles/mac-devices/templates/ZebrunnerAdb.plist
        dest: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerAdb.plist"
        mode: "0644"
        owner: "{{ lookup('env', 'USER') }}"
        group: staff
      vars:
        mac_devices_adb_path: "{{ mac_devices_adb.stdout }}"

    - name: Load ZebrunnerAdb agent via launchctl
      ansible.builtin.command:
        argv:
          - launchctl
          - bootstrap
          - "gui/{{ mac_devices_user_uid.stdout }}"
          - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerAdb.plist"
      changed_when: false
      become: false

# The wireless watchdog (README.md#wireless-watchdog): the containers of the wireless devices that stopped by themselves
# are started every WIRELESS_WATCHDOG_INTERVAL seconds by a launch agent; removed from a host without wireless devices
# or with WIRELESS_WATCHDOG_INTERVAL 0
- name: Wireless watchdog
  vars:
    mac_devices_watchdog: >-
      {{ (WIRELESS_WATCHDOG_INTERVAL | int) > 0 and (devices | map(attribute='connection', default='usb') | map('string')
         | map('lower') | select('equalto', 'wireless') | list | length > 0) }}
  tags: [devices, watchdog]
  block:
    - name: Check if ZebrunnerWirelessWatchdog agent is loaded
      ansible.builtin.command: launchctl list com.zebrunner.wireless-watchdog
      register: mac_devices_watchdog_loaded
      failed_when: false
      changed_when: false
      become: false

    - name: Unload ZebrunnerWirelessWatchdog agent if loaded
      ansible.builtin.command:
        argv:
          - launchctl
          - bootout
          - "gui/{{ mac_devices_user_uid.stdout }}"
          - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerWirelessWatchdog.plist"
      when: mac_devices_watchdog_loaded.rc == 0
      changed_when: false
      become: false

    - name: Copy ZebrunnerWirelessWatchdog.plist into LaunchAgents
      ansible.builtin.template:
        src: roles/mac-devices/templates/ZebrunnerWirelessWatchdog.plist
        dest: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerWirelessWatchdog.plist"
        mode: "0644"
        owner: "{{ lookup('env', 'USER') }}"
        group: staff
      when: mac_devices_watchdog | bool
      tags: [files]

    - name: Load ZebrunnerWirelessWatchdog agent via launchctl
      ansible.builtin.command:
        argv:
          - launchctl
          - bootstrap
          - "gui/{{ mac_devices_user_uid.stdout }}"
          - "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerWirelessWatchdog.plist"
      when: mac_devices_watchdog | bool and not ansible_check_mode
      changed_when: false
      become: false

    - name: Remove ZebrunnerWirelessWatchdog.plist without wireless devices
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/ZebrunnerWirelessWatchdog.plist"
        state: absent
      when: not mac_devices_watchdog | bool
      become: false

# The iOS simulators run on the host as SIMULATOR_USER (README.md#ios-simulators): their connector and Appium containers
# run xcrun of the host over ssh with a key of the agent, Remote Login (System Settings, General, Sharing) must be on for
# that user. The apps under test of a simulator run as that user too: a dedicated user without access to the secrets of
# the host (zebrunner-farm.env, config/settings.yml, ~/.ssh and the scripts of the agent of the user of the deploy).
- name: Simulators
  when: "'ios-sim' in mac_devices_connections"
  tags: [devices, simulators]
  vars:
    mac_devices_deploy_user: "{{ lookup('env', 'USER') }}"
    mac_devices_sim_user: "{{ SIMULATOR_USER | default('', true) | string | trim }}"
    # the user of the deploy as SIMULATOR_USER: the behaviour of the earlier versions, no user is created
    mac_devices_sim_dedicated: "{{ mac_devices_sim_user != mac_devices_deploy_user }}"
    mac_devices_sim_home: "/Users/{{ mac_devices_sim_user }}"
    # restrict: no forwarding and no pty; from: the loopback of Docker Desktop; command: the commands run by the shell
    # and the environment of zebrunner-simulator-ssh, never an interactive shell or the login files of the user
    mac_devices_sim_key_options: >-
      restrict,from="{{ SIMULATOR_SSH_FROM }}",command="/usr/local/bin/zebrunner-simulator-ssh"
  block:
    - name: Check the user of the simulators
      ansible.builtin.assert:
        that:
          - mac_devices_sim_user is regex('^[a-z_][a-z0-9_.-]{0,31}$')
          - mac_devices_sim_user != 'root'
          - SIMULATOR_SSH_FROM | string is regex('^[A-Za-z0-9.:/*?!_-]+(,[A-Za-z0-9.:/*?!_-]+)*$')
        fail_msg: >-
          SIMULATOR_USER must be the name of a macOS user other than root (lower case letters, digits, '_', '.' and '-'),
          SIMULATOR_SSH_FROM the comma separated addresses, networks or names of from= of authorized_keys
        quiet: true
      tags: [precheck, validate]

    - name: Create the ssh folder of the agent
      ansible.builtin.file:
        path: "{{ agent_dir }}/ssh"
        state: directory
        mode: "0700"
        owner: "{{ mac_devices_deploy_user }}"
      become: false

    - name: Generate the ssh key of the simulators
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - zebrunner-mcloud-simulators
          - -f
          - "{{ agent_dir }}/ssh/id_ed25519"
        creates: "{{ agent_dir }}/ssh/id_ed25519"
      become: false

    - name: Read the public ssh key of the simulators
      ansible.builtin.slurp:
        src: "{{ agent_dir }}/ssh/id_ed25519.pub"
      register: mac_devices_ssh_public_key
      become: false

    - name: Copy the forced command of the ssh key of the simulators
      ansible.builtin.copy:
        src: zebrunner-simulator-ssh
        dest: /usr/local/bin/zebrunner-simulator-ssh
        mode: "0755"
        owner: root
        group: wheel

    - name: Create the group of the user of the simulators
      ansible.builtin.group:
        name: "{{ mac_devices_sim_user }}"
        system: true
        state: present
      when: mac_devices_sim_dedicated | bool

    # hidden (not in the login window), no password: ssh with the key of the simulators only
    - name: Create the user of the simulators
      ansible.builtin.user:
        name: "{{ mac_devices_sim_user }}"
        group: "{{ mac_devices_sim_user }}"
        comment: Zebrunner MCloud simulators
        home: "{{ mac_devices_sim_home }}"
        create_home: true
        shell: /bin/zsh
        hidden: true
        state: present
      when: mac_devices_sim_dedicated | bool

    - name: Make the home of the user of the simulators private
      ansible.builtin.file:
        path: "{{ mac_devices_sim_home }}"
        state: directory
        mode: "0700"
        owner: "{{ mac_devices_sim_user }}"
        group: "{{ mac_devices_sim_user }}"
      when: mac_devices_sim_dedicated | bool and not ansible_check_mode

    # the authorized keys of the user of the simulators are of root: a process of the user (an app under test) does not
    # change the options of the key
    - name: Create the ssh folder of the user of the simulators
      ansible.builtin.file:
        path: "{{ mac_devices_sim_home }}/.ssh"
        state: directory
        mode: "0755"
        owner: root
        group: wheel
      when: mac_devices_sim_dedicated | bool and not ansible_check_mode

    - name: Authorize the ssh key of the simulators for the user of the simulators
      ansible.builtin.copy:
        content: "{{ mac_devices_sim_key_options }} {{ mac_devices_ssh_public_key.content | b64decode | trim }}\n"
        dest: "{{ mac_devices_sim_home }}/.ssh/authorized_keys"
        mode: "0644"
        owner: root
        group: wheel
      when: mac_devices_sim_dedicated | bool and not ansible_check_mode

    # Remote Login for "Only these users" is the group com.apple.access_ssh, for all users there is no such group
    - name: Find the users of Remote Login
      ansible.builtin.command: dscl . -read /Groups/com.apple.access_ssh
      register: mac_devices_access_ssh
      changed_when: false
      failed_when: false
      check_mode: false
      when: mac_devices_sim_dedicated | bool

    - name: Let the user of the simulators in over Remote Login
      ansible.builtin.command:
        argv: [dseditgroup, -o, edit, -a, "{{ mac_devices_sim_user }}", -t, user, com.apple.access_ssh]
      changed_when: false
      when: mac_devices_sim_dedicated | bool and mac_devices_access_ssh.rc | default(1) == 0

    # an ACL denies the user of the simulators the home and the agent folder of the user of the deploy, whatever their
    # mode and groups (every local user of macOS is in staff, the group of the home); the earlier entry is replaced
    - name: Deny the user of the simulators the home and the agent folder of the user of the deploy
      ansible.builtin.command:
        argv:
          - /bin/bash
          - -c
          - |
            entry="user:${1} deny list,search,readattr,readextattr,readsecurity,add_file,add_subdirectory,delete_child"
            for path in "${@:2}"; do
              /bin/chmod -a "$entry" "$path" 2> /dev/null
              /bin/chmod +a "$entry" "$path" || exit 1
            done
          - acl
          - "{{ mac_devices_sim_user }}"
          - "{{ lookup('env', 'HOME') }}"
          - "{{ agent_dir }}"
      changed_when: false
      when: mac_devices_sim_dedicated | bool and not ansible_check_mode

    # the key of the earlier versions gave a shell of the user of the deploy
    - name: Remove the ssh key of the simulators from the user of the deploy
      ansible.builtin.lineinfile:
        path: "{{ lookup('env', 'HOME') }}/.ssh/authorized_keys"
        regexp: "zebrunner-mcloud-simulators$"
        state: absent
      become: false
      when: mac_devices_sim_dedicated | bool

    - name: Authorize the ssh key of the simulators for the user of the deploy
      ansible.builtin.lineinfile:
        path: "{{ lookup('env', 'HOME') }}/.ssh/authorized_keys"
        line: "{{ mac_devices_sim_key_options }} {{ mac_devices_ssh_public_key.content | b64decode | trim }}"
        regexp: "zebrunner-mcloud-simulators$"
        create: true
        mode: "0600"
        owner: "{{ mac_devices_deploy_user }}"
      become: false
      when: not mac_devices_sim_dedicated | bool

    # reported, the deploy goes on
    - name: Report the simulators as the user of the deploy  # noqa: ignore-errors
      ansible.builtin.assert:
        that: mac_devices_sim_dedicated | bool
        fail_msg: >-
          SIMULATOR_USER is the user of the deploy: the apps under test of the simulators read the secrets of the host.
          Remove SIMULATOR_USER from config/settings.yml (mcloud-sim by default) and recreate the simulators as that
          user (README.md#ios-simulators).
        success_msg: "The simulators run as {{ mac_devices_sim_user }}."
      ignore_errors: true

    - name: Check Remote Login of the host
      ansible.builtin.command: nc -z -G 3 127.0.0.1 22
      register: mac_devices_remote_login
      failed_when: false
      changed_when: false
      become: false

    # a missing Remote Login is reported but does not stop the deploy: it can be turned on later
    - name: Report Remote Login of the host  # noqa: ignore-errors
      ansible.builtin.assert:
        that: mac_devices_remote_login.rc == 0
        fail_msg: "Remote Login is off: turn it on in System Settings, General, Sharing for the iOS simulators."
        success_msg: "Remote Login is on."
      ignore_errors: true

    # the simulators of the devices are the ones of the user of the simulators (xcrun simctl of its own): the ones of
    # another user (e.g. of the user of the deploy, the earlier versions) are created again as it (README.md#ios-simulators)
    - name: List the simulators of the user of the simulators
      ansible.builtin.command:
        argv:
          - ssh
          - -i
          - "{{ agent_dir }}/ssh/id_ed25519"
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=accept-new
          - -o
          - "UserKnownHostsFile={{ agent_dir }}/ssh/known_hosts"
          - -o
          - ConnectTimeout=10
          - "{{ mac_devices_sim_user }}@127.0.0.1"
          - xcrun simctl list devices --json
      register: mac_devices_simulators
      changed_when: false
      failed_when: false
      check_mode: false
      become: false
      when: mac_devices_remote_login.rc | default(1) == 0

    - name: Report the simulators of the devices that the user of the simulators does not have  # noqa: ignore-errors
      vars:
        mac_devices_sim_udids: >-
          {{ ((mac_devices_simulators.stdout | default('{}', true) | from_json).devices | default({})).values()
             | flatten | map(attribute='udid') | list }}
        mac_devices_sim_missing: >-
          {{ devices | selectattr('connection', 'defined') | selectattr('connection', 'match', '(?i)^ios-sim$')
             | map(attribute='id') | map('string') | map('trim') | reject('in', mac_devices_sim_udids) | list }}
      ansible.builtin.assert:
        that:
          - mac_devices_simulators.rc == 0
          - mac_devices_sim_missing | length == 0
        fail_msg: >-
          {{ ('the simulators ' ~ (mac_devices_sim_missing | join(', ')) ~ ' are not simulators of ' ~ mac_devices_sim_user
              ~ ': create them as that user and put their udids into config/devices.yml (README.md#ios-simulators)')
             if mac_devices_simulators.rc == 0
             else ('xcrun simctl of ' ~ mac_devices_sim_user ~ ' over ssh failed: '
                   ~ (mac_devices_simulators.stderr | default('', true) | trim)) }}
        success_msg: "The simulators of the devices are simulators of {{ mac_devices_sim_user }}."
      when: mac_devices_simulators is not skipped
      ignore_errors: true
