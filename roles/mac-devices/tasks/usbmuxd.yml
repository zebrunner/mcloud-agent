---

- name: Check OS compatibility
  assert:
    that:
      - ansible_facts['system'] == "Darwin"
    fail_msg: "OS version is not compatible! This playbook supports macOS (Darwin) only."
    success_msg: "OS is compatible: {{ ansible_facts['system'] }}"
  tags: [devices, precheck]

- name: Get current user id
  command: id -u
  register: user_uid
  changed_when: false
  become: no
  tags: [devices, usbmuxd, listener]

- name: Check setup completion
  assert:
    that:
      - lookup('file', 'roles/mac-devices/vars/main.yml', errors='ignore') is not none
    fail_msg: "You have to set up services in advance using: ./zebrunner.sh setup!"
    success_msg: "Setup is ready: 'roles/mac-devices/vars/main.yml' exists."
  tags: [devices, precheck]

- name: Check 'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable
  assert:
    that:
      - lookup('env','ZEBRUNNER_MCLOUD_AGENT_DIR') is not none
    fail_msg: "You have to set up 'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable in advance!"
    success_msg: "'ZEBRUNNER_MCLOUD_AGENT_DIR' env variable is defined."
  tags: [devices, precheck]

- name: Collect all device IDs and names
  set_fact:
    all_ids: "{{ devices | map(attribute='id') | list }}"
    all_names: "{{ devices | map(attribute='name') | list }}"
  tags: [devices, precheck, dedup]

- name: Count occurrences of each device id
  set_fact:
    id_counts: "{{ id_counts | default({}) | combine({item: (id_counts | default({}) )[item] | default(0) + 1}) }}"
  loop: "{{ all_ids }}"
  tags: [devices, precheck, dedup]

- name: Count occurrences of each device name
  set_fact:
    name_counts: "{{ name_counts | default({}) | combine({item: (name_counts | default({}))[item] | default(0) + 1}) }}"
  loop: "{{ all_names }}"
  tags: [devices, precheck, dedup]

- name: Determine duplicate ids
  set_fact:
    dup_ids: "{{ id_counts | dict2items | selectattr('value', '>', 1) | map(attribute='key') | list }}"
  tags: [devices, precheck, dedup]

- name: Determine duplicate names
  set_fact:
    dup_names: "{{ name_counts | dict2items | selectattr('value', '>', 1) | map(attribute='key') | list }}"
  tags: [devices, precheck, dedup]

- name: Check for duplicate device IDs or names
  assert:
    that:
      - dup_ids | length == 0
      - dup_names | length == 0
    fail_msg: "Duplicate devices found! Duplicate IDs: {{ dup_ids }} Duplicate Names: {{ dup_names }}"
    success_msg: "All device IDs and names are unique."
  tags: [devices, precheck, dedup]

- name: Copy 'zebrunner-farm' script file
  template:
    src: zebrunner-farm
    dest: /usr/local/bin/zebrunner-farm
    mode: '0755'
    owner: root
    group: wheel
  changed_when: false
  tags: [devices, files]

- name: Copy devices details file
  template:
    src: mcloud-devices.txt
    dest: /usr/local/bin/mcloud-devices.txt
    mode: '0644'
    owner: root
    group: wheel
  changed_when: false
  tags: [devices, files]

- name: Check if ZebrunnerDevicesListener agent is loaded
  command: launchctl list com.zebrunner.mcloud
  register: mcloud_agent_loaded
  failed_when: false
  changed_when: false
  become: no
  tags: [devices, precheck, listener]

- name: Unload ZebrunnerDevicesListener agent if loaded
  command: launchctl bootout gui/{{ user_uid.stdout }} "{{ lookup('env','HOME') }}/Library/LaunchAgents/ZebrunnerDevicesListener.plist"
  when: mcloud_agent_loaded.rc == 0
  changed_when: false
  become: no
  tags: [devices, listener]

- name: Check if ZebrunnerUsbmuxd agent is loaded
  command: launchctl list com.zebrunner.usbmuxd
  register: usbmuxd_agent_loaded
  failed_when: false
  changed_when: false
  become: no
  tags: [devices, precheck, usbmuxd]

- name: Unload ZebrunnerUsbmuxd agent if loaded
  command: launchctl bootout gui/{{ user_uid.stdout }} "{{ lookup('env','HOME') }}/Library/LaunchAgents/ZebrunnerUsbmuxd.plist"
  when: usbmuxd_agent_loaded.rc == 0
  changed_when: false
  become: no
  tags: [devices, usbmuxd]

- name: Copy ZebrunnerDevicesListener.plist into LaunchAgents
  template:
    src: roles/mac-devices/templates/ZebrunnerDevicesListener.plist
    dest: "{{ lookup('env','HOME') }}/Library/LaunchAgents/ZebrunnerDevicesListener.plist"
    mode: '0644'
    owner: "{{ lookup('env','USER') }}"
    group: staff
  changed_when: false
  tags: [devices, listener]

- name: Copy ZebrunnerUsbmuxd.plist into LaunchAgents
  template:
    src: roles/mac-devices/templates/ZebrunnerUsbmuxd.plist
    dest: "{{ lookup('env','HOME') }}/Library/LaunchAgents/ZebrunnerUsbmuxd.plist"
    mode: '0644'
    owner: "{{ lookup('env','USER') }}"
    group: staff
  changed_when: false
  tags: [devices, usbmuxd]

- name: Load ZebrunnerDevicesListener agent if it was loaded earlier
  command: launchctl bootstrap gui/{{ user_uid.stdout }} "{{ lookup('env','HOME') }}/Library/LaunchAgents/ZebrunnerDevicesListener.plist"
  when: mcloud_agent_loaded.rc == 0
  changed_when: false
  become: no
  tags: [devices, listener]

- name: Enable ZebrunnerDevicesListener agent via launchctl if it was loaded earlier
  command: launchctl enable gui/{{ user_uid.stdout }}/com.zebrunner.mcloud
  when: mcloud_agent_loaded.rc == 0
  changed_when: false
  become: no
  tags: [devices, listener]

- name: Load ZebrunnerUsbmuxd agent via launchctl
  command: launchctl bootstrap gui/{{ user_uid.stdout }} "{{ lookup('env','HOME') }}/Library/LaunchAgents/ZebrunnerUsbmuxd.plist"
  changed_when: false
  become: no
  tags: [devices, usbmuxd]

- name: Enable ZebrunnerUsbmuxd agent via launchctl
  command: launchctl enable gui/{{ user_uid.stdout }}/com.zebrunner.usbmuxd
  changed_when: false
  become: no
  tags: [devices, usbmuxd]
