# MCloud agent devices listener log rotation by newsyslog: 10 MB per file, 7 bzip2 archives.
# Only listener.log and wireless-watchdog.log are rotated: the listener and the runs of the wireless watchdog append
# to them per write, while launchd keeps the other logs (listener.err.log, usbmuxd-socat*.log) open, and they stay
# small.
# logfilename                                                                [owner:group]                       mode count size when flags
{{ agent_dir }}/logs/listener.log    {{ lookup('env', 'USER') }}:staff    644  7     10240 *    JN
{{ agent_dir }}/logs/wireless-watchdog.log    {{ lookup('env', 'USER') }}:staff    644  7     10240 *    JN
