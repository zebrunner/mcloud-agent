---
version: 2
updates:
  # actions/* and the other actions of .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # ansible and ruff of tests/requirements-lint.txt, the shared linters are updated in mcloud-conventions
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    ignore:
      - dependency-name: actionlint-py
      - dependency-name: hadolint-py
      - dependency-name: pymarkdownlnt
      - dependency-name: shellcheck-py
      - dependency-name: shfmt-py
      - dependency-name: yamllint
  # the base image of tests/Dockerfile, the Linux environment of the tests
  - package-ecosystem: docker
    directory: /tests
    schedule:
      interval: weekly
