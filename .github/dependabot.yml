---
version: 2
updates:
  # actions/* and the other actions of .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # the linters and ansible of tests/requirements-lint.txt
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
  # the base image of tests/Dockerfile, the Linux environment of the tests
  - package-ecosystem: docker
    directory: /tests
    schedule:
      interval: weekly
