---
name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:
# a new push to a pull request cancels its outdated run, runs of the branches themselves are kept
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # the reusable lint job of mcloud-conventions (CONVENTIONS.md)
  lint:
    uses: zebrunner/mcloud-conventions/.github/workflows/lint.yml@v1

  # the OS of the tests: a macOS runner waits 10-40 minutes, so a pull request runs on macOS only when it changes a
  # file the macOS tests use (the playbooks and roles of macOS, zebrunner.sh, the scripts, the tests); the pushes and
  # the manual runs always do
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os: ${{ steps.os.outputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: The OS of the tests
        id: os
        env:
          EVENT: ${{ github.event_name }}
        run: |
          macos=true
          if [[ "$EVENT" == pull_request ]]; then
            # the checkout is the merge commit of the pull request, its first parent the base branch
            files="$(git diff --name-only HEAD^1 HEAD)"
            # all but the docs, the linters, roles/devices (Linux) and tests/Dockerfile (Linux, the lower case names of
            # tests/ are the tests)
            paths=(
              'zebrunner\.sh' 'Makefile' 'agent\.yml' 'devices\.yml' 'mac-devices\.yml' 'hosts' 'versions\.yml' 'config/'
              'patch/' 'scripts/' 'roles/common/' 'roles/download/' 'roles/mac-devices/' 'tests/[[:lower:]]'
              '\.github/workflows/ci\.yml'
            )
            if ! grep -qE "^($(IFS='|' && echo "${paths[*]}"))" <<< "$files"; then
              macos=false
              echo "::notice::no file of the macOS tests changed: the tests run on Linux only"
            fi
          fi
          if [[ "$macos" == true ]]; then
            echo 'os=["ubuntu-latest", "macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  # macOS also builds usbmuxd_watch from the source and runs its tests on the result (one macOS runner)
  tests:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os }}
    # macOS also creates and boots an iOS simulator as the user of the simulators (tests/simulator_user_test.sh)
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements-lint.txt
      # the version of tests/requirements-lint.txt (updated by dependabot), the one of `make lint` and `make test`
      - name: Install ansible
        run: pip install "$(grep '^ansible-core==' tests/requirements-lint.txt)"
      - name: Run tests
        run: tests/run_all.sh
        env:
          JUNIT_DIR: ${{ runner.temp }}/junit
          # the runner is disposable: the test of the user of the simulators creates a macOS user
          MCLOUD_SIMULATOR_E2E: ${{ runner.os == 'macOS' && '1' || '' }}
      - name: Tests report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: ${{ runner.temp }}/junit/*.xml
          check_name: tests report (${{ matrix.os }})
          annotate_only: true
          detailed_summary: true
          require_tests: true
      # the usbmuxd_watch binary built from the source passes the tests of the committed one
      - name: Build usbmuxd_watch
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: scripts/build_usbmuxd_watch.sh "${RUNNER_TEMP}/usbmuxd_watch"
      - name: Test usbmuxd_watch
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: tests/usbmuxd_watch_test.sh
        env:
          USBMUXD_WATCH: ${{ runner.temp }}/usbmuxd_watch
          JUNIT_DIR: ${{ runner.temp }}/junit/usbmuxd-watch
      - name: usbmuxd_watch report
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: ${{ runner.temp }}/junit/usbmuxd-watch/*.xml
          check_name: usbmuxd_watch report
          annotate_only: true
          detailed_summary: true
          require_tests: true
      - name: Upload tests JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}
          path: ${{ runner.temp }}/junit/
