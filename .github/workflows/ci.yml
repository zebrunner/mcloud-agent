---
name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:
# a new push to a pull request cancels its outdated run, runs of the branches themselves are kept
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # the reusable lint job of mcloud-conventions (CONVENTIONS.md)
  lint:
    uses: zebrunner/mcloud-conventions/.github/workflows/lint.yml@v1

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ansible
        run: pip install ansible-core
      - name: Run tests
        run: tests/run_all.sh
        env:
          JUNIT_DIR: ${{ runner.temp }}/junit
      - name: Tests report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: ${{ runner.temp }}/junit/*.xml
          check_name: tests report (${{ matrix.os }})
          annotate_only: true
          detailed_summary: true
          require_tests: true
      - name: Upload tests JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}
          path: ${{ runner.temp }}/junit/
