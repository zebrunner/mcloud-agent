---

DEVICE_IMAGE: public.ecr.aws/zebrunner/mcloud-device
DEVICE_VERSION: 3.0-hardening-2026.08

# [OBLIGATORY] Shared token the provider sends (x-stf-internal-token) so device
# screenshot uploads and app-install blob fetches pass the authenticated STF
# storage routes. MUST match STORAGE_TOKEN in the STF server's variables.env.
# Defined here (lowest precedence) so it applies to both the devices and
# mac-devices roles; override per host in roles/*/vars/main.yml only if needed.
# Sourced from the environment: this file is tracked in git, so the value must
# never be written here. Export STORAGE_TOKEN before running the playbook.
STORAGE_TOKEN: "{{ lookup('env', 'STORAGE_TOKEN') }}"

APPIUM_IMAGE: public.ecr.aws/zebrunner/appium
APPIUM_VERSION: 2.1

UPLOADER_IMAGE: public.ecr.aws/zebrunner/uploader
UPLOADER_VERSION: 3.6

IOS_CONNECTOR_IMAGE: public.ecr.aws/zebrunner/mcloud-ios-connector
IOS_CONNECTOR_VERSION: 1.1.1

ANDROID_CONNECTOR_IMAGE: public.ecr.aws/zebrunner/mcloud-android-connector
ANDROID_CONNECTOR_VERSION: 1.1.1

# Put true to disable app size check using local appium storage
APPIUM_APP_SIZE_DISABLE: false

# Optimized app verifications for AppCenter and AWS S3 storages
APPIUM_APP_FETCH_RETRIES: 2
APPIUM_MAX_LOCK_FILE_LIFETIME: 180
APPIUM_APP_WAITING_TIMEOUT: 90

RESTARTS_LIMIT: 50
