---
- name: Deploy MCloud agent for the Android and iOS devices of a Linux server
  hosts: devices_servers
  become: true
  # the roles use ansible_facts['system'] only, hardware facts are slow on macOS (system_profiler)
  gather_subset: [min]
  # the images and their versions, then the settings of this host (README.md#settings): the later file overrides the earlier one; without
  # a settings file the versions are loaded again and the precheck of the role asks for ./zebrunner.sh setup
  vars_files:
    - versions.yml
    - [config/settings.yml, versions.yml]
    - [config/devices.yml, versions.yml]
  vars:
    # the folder of the agent: the playbooks are in it
    agent_dir: "{{ playbook_dir }}"
  roles:
    - devices
    - download
